        { at: 1.00, dist: 1.00, yaw: -20, aim: 0.50 },   // home, so the loop does not jump
    ];
    const TOUR_SECONDS = 17;

    function smooth(t) { return t * t * (3 - 2 * t); }

    function tourAt(seconds) {
        const t = (seconds % TOUR_SECONDS) / TOUR_SECONDS;
        let i = 0;
        while (i < TOUR.length - 2 && TOUR[i + 1].at <= t) i++;
        const a = TOUR[i], b = TOUR[i + 1];
        const span = Math.max(b.at - a.at, 1e-6);
        const k = smooth(Math.min(Math.max((t - a.at) / span, 0), 1));
        return { dist: a.dist + (b.dist - a.dist) * k,
                 yaw: a.yaw + (b.yaw - a.yaw) * k,
                 aim: a.aim + (b.aim - a.aim) * k };
    }

    /* The distance that framed the whole product; every tour step is a multiple of it, so the
       choreography holds whatever size flag this template is. */
    function framingDistance() {
        const aspect = Math.max(stage.clientWidth / Math.max(stage.clientHeight, 1), 0.2);
        const half = Math.max(size.y, size.x / aspect) / 2;
        return half / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.2;
    }

    /* How close the tour may come, given the shape of the window it is playing in. A close-up that
       frames a hand's width of fabric is a nice detail on a wide strip and a wall of blue on a
       phone, where the same distance shows a fraction of the flag (shop rule, 2026-08-31). The
       floor rises as the stage narrows. */
    function closestAllowed() {
        const width = stage.clientWidth || 1;
        if (width < 420) return 0.78;
        if (width < 620) return 0.62;
        if (width < 900) return 0.44;
        return 0.28;
    }

    function driveTour(seconds) {
        const step = tourAt(seconds);
        step.dist = Math.max(step.dist, closestAllowed());
        const target = new THREE.Vector3(centre.x, centre.y + (step.aim - 0.5) * size.y, centre.z);
        const radians = THREE.MathUtils.degToRad(step.yaw);
        const away = framingDistance() * step.dist;
        camera.position.set(target.x + Math.sin(radians) * away,
                            // Rising slightly as the camera pulls back, so a wide shot looks down
                            // the flag instead of up at it.
                            target.y + away * 0.06,
                            target.z + Math.cos(radians) * away);
        camera.lookAt(target);
    }
    /* How far the guide lines float above the cloth. It has to clear the reinforcing hem, which
       stands 2 mm proud: at the old 0.4 mm the red cut line was sunk INSIDE the fabric along every
       hem edge and surfaced through it in patches, which is the "clipping" a hero close-up made
       obvious (shop rule, 2026-08-31). 2.4 mm on a three-metre flag is invisible from any distance
       that is not a close-up, and at a close-up it reads as a line lying ON the cloth. */
    const GUIDE_LIFT = 2.4 * S;
    const positions = geometry.attributes.position;
    const restXY = [];
    for (let i = 0; i < positions.count; i++) {
        restXY.push([positions.getX(i), positions.getY(i)]);
    }
    /* The reinforcing hem is sewn DOUBLE — a flat pancake of fabric, not paint. Every cloth
       vertex inside the hem band (read off the same canvas the AO uses) sits 2 mm proud, so the
       seam catches light as a real ridge on top of the darker AO. */
    const hemPixels = hemCtx.getImageData(0, 0, hem.width, hem.height).data;
    const hemRidge = new Float32Array(positions.count);
    for (let i = 0; i < positions.count; i++) {
        const [x, y] = restXY[i];
        const u = Math.min(hem.width - 1, Math.max(0,
            Math.round((x - box.x0) / clothW * hem.width)));
        const v = Math.min(hem.height - 1, Math.max(0,
            Math.round((box.y1 - y) / clothH * hem.height)));
        hemRidge[i] = hemPixels[(v * hem.width + u) * 4] < 250 ? 2 * S : 0;
    }
    const AMPLITUDE = clothW * 0.10;
    const WAVE_K = 2 * Math.PI / (clothH * 0.8);
    // The cantilever: sway grows with the SQUARE of the arc position (a tapering tube bends ever
    // more the further from the base) and the tip gets a faster second harmonic — the whip.
    const SWAY = clothH * 0.045;

    function poleSway(s, t) {
        return SWAY * s * s * (Math.sin(t * 1.15) * 0.8 + Math.sin(t * 2.55 + 1.2) * 0.2 * s);
    }

    function waveOnly(x, y, t) {
        /* The cloth's OWN wave grows with distance from its attachment — the sleeve along the left
           edge and the arm along the top. The envelope reaches EXACTLY zero at the attachment: the
           sleeve is sewn around the tube, so at that line the cloth's motion IS the tube's motion
           (poleSway) and nothing else — an extra residual wave there is the disconnect the shop
           saw. On a RIGID Regular frame there is no sway at all and the cloth breathes only near
           the free bottom-right corner, furthest from both rigid members. */
        const fromMast = Math.min(Math.max((x - box.x0) / clothW, 0), 1);
        const fromArm = Math.min(Math.max((box.y1 - y) / clothH, 0), 1);
        if (construction === 'top') {
            /* Hung by the top edge only: the cloth is anchored along the arm and FREE everywhere
               else, so the wave grows straight down — the bottom edge moves most. */
            return AMPLITUDE * Math.pow(fromArm, 1.25)
                * Math.sin(WAVE_K * (x * 0.9 + y) - t * 2.6)
                * (0.75 + 0.25 * Math.sin(t * 0.7 + y * 0.5));
        }
        if (data.rigid) {
            return AMPLITUDE * 0.6 * Math.pow(fromMast * fromArm, 1.9)
                * Math.sin(WAVE_K * (x * 0.9 + y) - t * 2.6)
                * (0.75 + 0.25 * Math.sin(t * 0.7 + y * 0.5));
        }
        const fromAttachment = Math.min(fromMast, fromArm);
        const envelope = Math.pow(Math.min(fromAttachment * 1.6, 1), 1.15);
        return AMPLITUDE * envelope
            * Math.sin(WAVE_K * (x * 0.9 + y) - t * 2.6)
            * (0.75 + 0.25 * Math.sin(t * 0.7 + y * 0.5));
    }

    function displacement(x, y, t) {
        const sway = mastArcOf ? poleSway(mastArcOf(x, y), t) : 0;
        return sway + waveOnly(x, y, t);
    }

    function withRidge(i, z) {
        return z + hemRidge[i];
    }

    function applyWind(t) {
        for (let i = 0; i < positions.count; i++) {
            const [x, y] = restXY[i];
            positions.setZ(i, withRidge(i, displacement(x, y, t)));
        }
        positions.needsUpdate = true;
        geometry.computeVertexNormals();
        for (const { line, base } of guides) {
            const attr = line.geometry.attributes.position;
            for (let i = 0; i < base.length; i++) {
                attr.setZ(i, displacement(base[i].x, base[i].y, t) + GUIDE_LIFT);
            }
            attr.needsUpdate = true;
        }
        // The fold is sewn to the cloth: same wind, 2 mm behind it.
        for (const fold of hemFolds) {
            for (let i = 0; i < fold.rest.length; i++) {
                const [x, y] = fold.rest[i];
                fold.positions.setZ(i, displacement(x, y, t) - 2 * S);
            }
            fold.positions.needsUpdate = true;
        }
        // The mast rides its own sway — the sleeve and the tube inside it move as one thing.
        for (const piece of mastPieces) {
            for (let v = 0; v < piece.s.length; v++) {
                piece.positions.setZ(v, piece.rest[v * 3 + 2] + poleSway(piece.s[v], t));
            }
            piece.positions.needsUpdate = true;
        }
        for (const collar of mastCollars) {
            collar.mesh.position.z = poleSway(collar.s, t);
        }
    }

    /* Still air is not a plane: real cloth keeps a gentle bow and a soft fold near the free
       corner. The same shape the wind displaces, frozen at a whisper — so "calm" has depth and
       toggling the wind does not snap between two different objects. */
    function restingBow(x, y) {
        // Wave only: at rest the POLE is straight, so the cloth's bow must not inherit sway.
        return waveOnly(x, y, 1.35) * 0.22;
    }

    function calmDown() {
        for (let i = 0; i < positions.count; i++) {
            const [x, y] = restXY[i];
            positions.setZ(i, withRidge(i, restingBow(x, y)));
        }
        positions.needsUpdate = true;
        geometry.computeVertexNormals();
        for (const { line, base } of guides) {
            const attr = line.geometry.attributes.position;
            for (let i = 0; i < base.length; i++) {
                attr.setZ(i, restingBow(base[i].x, base[i].y) + GUIDE_LIFT);
            }
            attr.needsUpdate = true;
        }
        for (const piece of mastPieces) {
            piece.positions.array.set(piece.rest);
            piece.positions.needsUpdate = true;
        }
        for (const collar of mastCollars) collar.mesh.position.z = 0;
        for (const fold of hemFolds) {
            for (let i = 0; i < fold.rest.length; i++) {
                const [x, y] = fold.rest[i];
                fold.positions.setZ(i, restingBow(x, y) - 2 * S);
            }
            fold.positions.needsUpdate = true;
        }
    }
    calmDown();

    function resize() {
        const w = stage.clientWidth, h = stage.clientHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    fitCamera();

    windBox.addEventListener('change', () => { if (!windBox.checked) calmDown(); });

    /* The other half of the quality ladder: watch what this machine actually manages and step
       down until it keeps up. Sampled in blocks rather than per frame, because one slow frame is
       a hiccup and a slow BLOCK is a slow device. Only ever steps down — a hero that oscillates
       between sharp and soft is worse than either. */
    const QUALITY_TARGET_MS = 22;          // ~45 fps
    const QUALITY_BLOCK = 45;              // frames per verdict
    let blockFrames = 0, blockStart = performance.now();

    function watchQuality() {
        if (!HERO || qualityStep >= QUALITY.length - 1) return;
        blockFrames += 1;
        if (blockFrames < QUALITY_BLOCK) return;
        const average = (performance.now() - blockStart) / blockFrames;
        blockFrames = 0;
        blockStart = performance.now();
        if (average <= QUALITY_TARGET_MS) return;
        qualityStep += 1;
        renderer.setPixelRatio(QUALITY[qualityStep]);
        resize();
        // Bottom of the ladder: resolution alone is not enough, so the fabric shader goes too.
        // Sheen and the weave bump are the expensive part and the least visible at hero size.
        if (qualityStep === QUALITY.length - 1) {
            clothMaterial.sheen = 0;
            clothMaterial.bumpMap = null;
            clothMaterial.roughnessMap = null;
            clothMaterial.needsUpdate = true;
        }
    }

    const cutRunner = installCut({ S, fabric: cutFit ? cutFit.ring : fabric, finished: fabric,
                                   morphs: !!(cutFit && cutFit.morph),
                                   cutSource, box, clothW, clothH,
                                   paintSilhouette, clothMaterial, group });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
        if (cutRunner) cutRunner(clock.getElapsedTime());
        watchQuality();
        if (windBox.checked) applyWind(clock.getElapsedTime());
        // The hero drives its own camera; the flag keeps its slow turn so the tour sees a moving
        // subject rather than a still one. Reduced motion leaves both alone — that setting exists
        // to stop exactly this.
        if (bare && !calm) {
            const seconds = clock.getElapsedTime();
            group.rotation.y = Math.sin(seconds * 0.16) * 0.5;
            driveTour(seconds);
        }
        controls.update();
        renderer.render(scene, camera);
    });
}

function ringArea(points) {
    let doubled = 0;
    for (let i = 0; i < points.length; i++) {
        const [x1, y1] = points[i];
        const [x2, y2] = points[(i + 1) % points.length];
        doubled += x1 * y2 - x2 * y1;
    }
    return Math.abs(doubled / 2);
}
</script>
</body>
</html>
