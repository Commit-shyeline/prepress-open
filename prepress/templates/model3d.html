* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink);
       font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
       display: flex; flex-direction: column; min-height: 100vh; }
header b { font-size: 16px; } header a { font-size: 12.5px; }
header .spacer { flex: 1; }
/* The stage owns the rest of the viewport; three.js reads its box, so CSS is the layout authority. */
#stage { flex: 1; min-height: 320px; position: relative; }
#stage canvas { display: block; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column;
          gap: 4px; font-size: 12.5px; background: color-mix(in srgb, var(--surface) 88%, transparent);
          border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.legend span { display: flex; gap: 7px; align-items: center; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend label { display: flex; gap: 7px; align-items: center; font-weight: 600; cursor: pointer;
                margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--line); }
.note-float { position: absolute; right: 12px; bottom: 12px; font-size: 12px; color: var(--muted);
              background: color-mix(in srgb, var(--surface) 88%, transparent);
              border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
#err { position: absolute; inset: 0; display: none; place-items: center; font-weight: 600;
       color: var(--alert); }
/* Decoration mode, for the hero: the scene only, no chrome, no interaction, transparent ground so
   the page's own background shows through. Same page, same code — a second copy would drift. */
body.bare header, body.bare .legend, body.bare .note-float { display: none; }
body.embed header { display: none; }
body.embed { background: transparent; min-height: 100vh; }
body.bare { background: transparent; min-height: 100vh; }
body.bare #stage canvas { pointer-events: none; }
/* In a frame the frame IS the viewport, and a hero band can be shorter than a reading page's
   floor. With #stage's 320 px minimum the body grew taller than its own iframe and the flag was
   clipped top and bottom on a phone (shop rule, 2026-09-01). No floor here: fit the frame given. */
body.bare, body.embed { height: 100vh; min-height: 0; overflow: hidden; }
body.bare #stage, body.embed #stage { min-height: 0; }
/* A cutting roll uses the BOTTOM of the frame — the bench, and the waste hanging off its edge. The
   legend and the side note live down there on an inspection page, where nothing else does; on a
   roll they sit exactly on the thing the whole sequence builds towards, and on a phone they cover
   it outright. So on a roll they move to the TOP, which is empty sky for most of it, and share the
   row rather than stacking blind: neither knows the other's wrapped height. */
body.cutting .legend { top: 12px; bottom: auto; max-width: min(62%, 460px); }
body.cutting .note-float { top: 12px; bottom: auto; max-width: 34%; }

<script type="module">
/* The flag as it will hang: the REAL cut outline as cloth, on the mast the price list actually sells
   with it (flag top flush with the mast top, bare pole below the foot — the price list's own drawings,
   pages 3-7). Phase 1 (+ wind) of tasks/plan-prepress-3d.md; artwork texture and finding markers
   come in later phases.

   The cloth is a densely subdivided PLANE clipped to the outline by an alpha silhouette, not a
   ShapeGeometry: ShapeGeometry triangulates the boundary only, and waving needs interior vertices
   to bend. The silhouette canvas is also exactly where the customer's artwork raster lands in the
   texture phase, so the wind checkbox forced the structure that phase needs anyway. */
import * as THREE from 'three';
import { OrbitControls } from '{{ asset("OrbitControls.js") }}';
import { shears, silhouette, fillSilhouette, pointInRing }
    from '{{ asset("fabric.js") }}';

/* A window onto a section of an existing curve — what TubeGeometry needs to build one telescoping
   piece without re-sampling the whole path. */
class SubCurve extends THREE.Curve {
    constructor(parent, from, to) {
        super();
        this.parent = parent;
        this.from = from;
        this.span = to - from;
    }
    getPoint(t) {
        return this.parent.getPointAt(this.from + t * this.span);
    }
}

/* The sleeve cross-section: a TEARDROP, not a circle — fabric stretched open by the pole
   (circular nose of `radius`) whose flanks converge to the seam at `tail` from the pole's
   centre, where the sleeve is sewn to the corpus. fraction walks the closed profile: 0 at the
   seam, around the nose the long way, back to the seam at 1. Returns [x, y] in profile space
   with +x pointing at the seam. */
function teardropPoint(fraction, radius, tail) {
    const phi = Math.acos(Math.min(radius / tail, 0.99));
    const flank = Math.sqrt(Math.max(tail * tail - radius * radius, 1e-9));
    const arc = radius * (2 * Math.PI - 2 * phi);
    const perimeter = 2 * flank + arc;
    let walked = fraction * perimeter;
    if (walked < flank) {
        const f = walked / flank;
        return [tail + f * (radius * Math.cos(phi) - tail), f * radius * Math.sin(phi)];
    }
    walked -= flank;
    if (walked < arc) {
        const theta = phi + walked / radius;
        return [radius * Math.cos(theta), radius * Math.sin(theta)];
    }
    const f = (walked - arc) / flank;
    return [radius * Math.cos(phi) + f * (tail - radius * Math.cos(phi)),
            -radius * Math.sin(phi) * (1 - f)];
}

function teardropPerimeter(radius, tail) {
    const phi = Math.acos(Math.min(radius / tail, 0.99));
    return 2 * Math.sqrt(Math.max(tail * tail - radius * radius, 1e-9))
        + radius * (2 * Math.PI - 2 * phi);
}

/* Sweep the teardrop along a curve. Options:
   - radiusAt(t), tailAt(t): profile size along the sweep (t 0..1);
   - tailDirAt(t, pos): WORLD direction the seam points at (toward the cloth) — projected onto
     the profile plane per ring;
   - uvAt(t, fraction, pos, aroundDist): texture coordinates per vertex; aroundDist is the real
     distance walked around the profile from the seam, in scene units — what a printed strip
     sewn into a loop measures.
   Returns { geometry, ringOfVertex } — the ring index per vertex, for wind riders. */
function sweepSleeve(curve, { rings = 36, around = 24, radiusAt, tailAt, tailDirAt, uvAt }) {
    const frames = curve.computeFrenetFrames(rings, false);
    const positions = [], uvs = [], indices = [], ringOfVertex = [];
    for (let r = 0; r <= rings; r++) {
        const t = r / rings;
        const pos = curve.getPointAt(t);
        const N = frames.normals[Math.min(r, rings - 1)];
        const B = frames.binormals[Math.min(r, rings - 1)];
        const want = tailDirAt(t, pos);
        // The seam axis: the wanted direction projected into the profile plane.
        let tx = want.dot(N), ty = want.dot(B);
        const len = Math.hypot(tx, ty) || 1;
        tx /= len; ty /= len;
        const radius = radiusAt(t), tail = tailAt(t);
        const perimeter = teardropPerimeter(radius, tail);
        for (let k = 0; k <= around; k++) {
            const fraction = k / around;
            const [px, py] = teardropPoint(fraction, radius, tail);
            // Rotate profile space into the (N, B) plane: +x along the seam axis.
            const ox = px * tx - py * ty, oy = px * ty + py * tx;
            positions.push(pos.x + N.x * ox + B.x * oy,
                           pos.y + N.y * ox + B.y * oy,
                           pos.z + N.z * ox + B.z * oy);
            // Distance from the seam the SHORT way round, both flanks alike — a strip sewn into
            // a loop shows the same artwork depth on both faces.
            const aroundDist = Math.min(fraction, 1 - fraction) * perimeter;
            uvs.push(...uvAt(t, fraction, pos, aroundDist));
            ringOfVertex.push(r);
        }
    }
    const cols = around + 1;
    for (let r = 0; r < rings; r++) {
        for (let k = 0; k < around; k++) {
            const a = r * cols + k, b = a + 1, c = a + cols, d = c + 1;
            indices.push(a, c, b, b, c, d);
        }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    return { geometry, ringOfVertex };
}

/* ── The Vento REGULAR's tunnels ──
   Measured off the flag's own cut outline: the notch in the top-left corner exists so the elbow
   clears the fabric, so the notch's width IS the left tunnel and its height IS the top one. The
   strips wrap the rigid frame as full sleeves (the shop: NOT folded in half), so they are erased
   from the flat silhouette and built as fabric tubes by rigidFrame below. */
function tunnelsOf(outline, box, clothW, S) {
    const leftEdgeTop = Math.max(...outline.filter(([x]) => x < box.x0 + 1e-4).map(([, y]) => y));
    const topEdgeLeft = Math.min(...outline.filter(([, y]) => y > box.y1 - 1e-4).map(([x]) => x));
    const notchW = topEdgeLeft - box.x0, notchH = box.y1 - leftEdgeTop;
    const plausible = (v) => v > 20 * S && v < clothW / 3;
    return { w: plausible(notchW) ? notchW : 110 * S,
             h: plausible(notchH) ? notchH : 110 * S };
}

/* ── The Vento REGULAR's frame ──
   Rigid hardware, from a photo: a dark aluminium pole, a rigid white arm, an elbow joining them in
   the notch the template cuts for it, and the two tunnel strips sewn round pole and arm as full
   sleeves. Nothing here moves in the wind — the frame is rigid and the wind model knows it.

   A FUNCTION and not a branch of the mast block, because a rolling cut shows a Regular SHEET on its
   own frame before cutting a Vento out of it: two callers, one frame, and no second copy to drift.

   WHERE the frame sits inside its tunnel is the whole difference between a sleeve and a missing
   strip. The pole used to stand ON the seam — the corpus edge — with a fixed 62 mm teardrop tail
   pointing INTO the corpus, so the ~110 mm strip the silhouette erases had nothing in it at all and
   the flag read as having had its sleeve cut off rather than folded over the pole and sewn (the
   shop, 2026-09-01, against the Vento winder line where it is right). The frame belongs at the
   OUTER edge of its own tunnel: the fabric folds over it there and comes back to be sewn at the
   corpus, which is exactly the span the tails below cover. */
function rigidFrame({ tunnel, box, groundY, S }) {
    const parts = new THREE.Group();
    const steel = new THREE.MeshStandardMaterial({ color: 0xb4b9c1, roughness: 0.42,
                                                   metalness: 0.12 });
    const poleR = 14 * S, armR = 5 * S;
    const poleWrap = poleR + 3 * S, armWrap = armR + 3 * S;
    const poleX = box.x0 + poleWrap, armY = box.y1 - armWrap;

    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(poleR, poleR, armY - groundY, 16), steel);
    pole.position.set(poleX, (groundY + armY) / 2, 0);
    parts.add(pole);
    const arm = new THREE.Mesh(
        new THREE.CylinderGeometry(armR, armR, box.x1 - poleX, 12),
        new THREE.MeshStandardMaterial({ color: 0xe8e8ea, roughness: 0.4 }));
    arm.rotation.z = Math.PI / 2;
    arm.position.set((poleX + box.x1) / 2, armY, 0);
    parts.add(arm);
    const elbow = new THREE.Mesh(
        new THREE.SphereGeometry(poleR * 1.25, 14, 12),
        new THREE.MeshStandardMaterial({ color: 0x2c2f36, roughness: 0.55 }));
    elbow.position.set(poleX, armY, 0);
    parts.add(elbow);

    /* The tunnels: fabric PANCAKES stretched open by the frame — the teardrop profile, seam
       pointing at the corpus. Each remembers which strip of the PAGE wraps it, so wearArtwork can
       dress it in the customer's own print. The tail reaches from the frame's centre to the seam,
       so a sleeve fills its tunnel exactly and meets the flat cloth instead of stopping short. */
    const sleeveCloth = () => new THREE.MeshPhysicalMaterial({
        color: 0xf4f4f6, roughness: 0.72, metalness: 0.0,
        sheen: 0.5, sheenRoughness: 0.55, sheenColor: new THREE.Color(0xffffff),
        side: THREE.DoubleSide,
    });
    const gap = 25 * S;
    const poleSleeveH = armY - gap - box.y0;
    const poleSweep = sweepSleeve(
        new THREE.LineCurve3(new THREE.Vector3(poleX, box.y0, 0),
                             new THREE.Vector3(poleX, box.y0 + poleSleeveH, 0)),
        { radiusAt: () => poleWrap,
          tailAt: () => Math.max(tunnel.w - poleWrap, poleWrap * 1.6),
          tailDirAt: () => new THREE.Vector3(1, 0, 0),
          uvAt: (t, fraction) => [fraction, t] });
    const poleSleeve = new THREE.Mesh(poleSweep.geometry, sleeveCloth());
    parts.add(poleSleeve);

    const armSleeveL = box.x1 - (poleX + gap);
    const armSweep = sweepSleeve(
        new THREE.LineCurve3(new THREE.Vector3(poleX + gap, armY, 0),
                             new THREE.Vector3(box.x1, armY, 0)),
        { radiusAt: () => armWrap,
          tailAt: () => Math.max(tunnel.h - armWrap, armWrap * 1.6),
          // Gravity: the slack of the top sleeve hangs DOWN off the rigid arm.
          tailDirAt: () => new THREE.Vector3(0, -1, 0),
          uvAt: (t, fraction) => [t, fraction] });
    const armSleeve = new THREE.Mesh(armSweep.geometry, sleeveCloth());
    parts.add(armSleeve);

    return { parts, poleX, sleeves: [
        { mesh: poleSleeve, w: tunnel.w, h: poleSleeveH, x: box.x0, y: box.y0 },
        { mesh: armSleeve, w: armSleeveL, h: tunnel.h, x: poleX + gap, y: armY }] };
}

const token = {{ token|tojson }};
const stage = document.getElementById('stage');

function fail(text) {
    const box = document.getElementById('err');
    box.textContent = text;
    box.style.display = 'grid';
}

const data = await fetch(`{{ base }}/api/templates/${token}/shape`).then(r => r.json()).catch(() => null);
/* `?cutFrom=<token>[,<token>…]` turns this page into the cutting animation: the flag starts as the
   FIRST shape listed — the sheet — and is cut down through each later one to this one, on this
   template's own mast. The end state is what the mast belongs to, which is why the chain runs on
   the destination's page rather than the sheet's. A single token is the two-shape cut this began
   as, unchanged.

   The order is not a preference, it is arithmetic: a cut only ever makes a shape SMALLER, so the
   tokens must descend by area. Measured on the four the shop rolls through — Regular S 20705 cm²,
   Play A 12517, Play C 11604, Play B 9847 — which is why the chain is A → C → B and not the
   A → B → C it is natural to say out loud. */
const params = new URLSearchParams(location.search);
const cutFromTokens = (params.get('cutFrom') || '')
    .split(',').map(one => one.trim()).filter(Boolean);
/* A roll is drawn in TWO LAYERS, which is what lets the cloth leave the flag's box.
   BACK is the flag, framed and moved as the hero's own tour moves it, drawn only into the top
   `band` of the canvas. FRONT is nothing but the cloth cut off it, drawn over the whole canvas
   afterwards, so it hangs past that band and over whatever the page puts below.
   `band` is where the two meet, as a fraction of the canvas height. The parent sets it, because
   only the parent knows how tall its hero is; on a page of its own the default gives the cloth
   room to hang without crowding the flag. */
let bandFraction = Math.min(Math.max(parseFloat(params.get('band')) || 0.66, 0.15), 0.98);
/* How wide the fallen cloth lies across the frame, as a fraction of it. Premium reads as BIG: a
   length of real fabric over the page, not a swatch pinned to it. The parent may tune it, because
   how much of a page a piece of cloth may cover is a question about the page. */
let frontSpan = Math.min(Math.max(parseFloat(params.get('span')) || 0.52, 0.25), 1.6);
const cutFromData = (await Promise.all(cutFromTokens.map(one =>
        fetch(`{{ base }}/api/templates/${one}/shape`).then(r => r.json()).catch(() => null))))
    .filter(shape => shape && !shape.error && (shape.netto || []).length);
// Tells the page's own chrome to get out of the bottom of the frame; see the stylesheet.
if (cutFromData.length) document.body.classList.add('cutting');
if (!data || data.error || !(data.netto || []).length) {
    fail((data && data.error) || 'Nie udało się wczytać kształtu szablonu.');
} else {
    build(data, cutFromData);
}

/* Ring plumbing the cut needs. polygon-clipping wants a CLOSED ring; walking and averaging want
   an open one, and mixing the two duplicates a vertex into every boolean. */
function closedRing(ring) {
    const closed = ring.slice();
    const [fx, fy] = closed[0], [lx, ly] = closed[closed.length - 1];
    if (fx !== lx || fy !== ly) closed.push([fx, fy]);
    return [closed];
}

function openRing(ring) {
    const open = ring.slice();
    const [fx, fy] = open[0], [lx, ly] = open[open.length - 1];
    if (fx === lx && fy === ly) open.pop();
    return open;
}

// The closest point ON the ring, not the closest vertex: the Regular's outline is nine points
// long, so its vertices say almost nothing about where a curve meets it.
function projectOnRing(ring, [px, py]) {
    let best = { distance: Infinity, index: 0, point: ring[0] };
    for (let i = 0; i < ring.length; i++) {
        const [ax, ay] = ring[i], [bx, by] = ring[(i + 1) % ring.length];
        const dx = bx - ax, dy = by - ay, span = dx * dx + dy * dy;
        const t = span ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / span)) : 0;
        const qx = ax + t * dx, qy = ay + t * dy;
        const distance = Math.hypot(px - qx, py - qy);
        if (distance < best.distance) best = { distance, index: i, point: [qx, qy] };
    }
    return best;
}

// The stretch of ring between two projected points, forward in index order.
function walkRing(ring, from, to) {
    const run = [from.point];
    const stop = (to.index + 1) % ring.length;
    let i = (from.index + 1) % ring.length;
    for (let guard = 0; guard <= ring.length && i !== stop; guard++) {
        run.push(ring[i]);
        i = (i + 1) % ring.length;
    }
    run.push(to.point);
    return run;
}

/* What to actually CUT when a destination will not fit inside its source, and whether the result
   then has to be transformed into the real outline.

   A template may carry its own `transform` ring: a shape drawn for exactly this, slimmer than the
   product so that it fits. That is preferred over anything computed, because it is a person's
   drawing rather than my guess. Whatever the shape, it is then shrunk about its own centroid by
   the least that makes it fit — and about the CENTROID, never a bbox corner: a feather flag does
   not reach its own bbox corners, so shrinking towards one carries the whole shape off the sheet
   (measured 2026-09-01: 0.05 by corner with everything still outside, 0.808 by centroid). */
function fitInside(destination, source, preferred) {
    const clip = window.polygonClipping;
    const outside = (ring) => clip.difference(closedRing(ring), closedRing(source))
                                  .reduce((sum, polygon) => sum + ringArea(polygon[0]), 0);
    /* What counts as "does not fit" rather than "two drawings of the same edge disagree".
       Measured across the roll: the worst HAIRLINE — a Play B against the Play C it comes out of,
       two outlines that share that edge — is 3 cm², and the smallest genuine MISFIT — a Drop
       against a Play B, where the hem really is 47 mm too narrow — is 401 cm². Anything between
       1e-3 and 4e-2 of the destination's area separates them; 1e-3 sits two orders below the
       misfit and keeps the hairline on the right side of the line, where the union clamp in
       build() absorbs it for nothing. At the old 2e-4 the hairline read as a misfit and every
       Play C → Play B cut was shrunk to 0.999 and then grown back over 1.3 s of dead animation. */
    const NOISE = ringArea(destination) * 1e-3;
    /* An EMPTY drawing is no drawing. `transform` is always present in the shape payload, so the
       caller always hands this an array — and `!preferred` on `[]` is false, which is why every
       cut so far reported `morph: true` whatever the geometry said. */
    const drawn = preferred && preferred.length > 2;
    if (!drawn && outside(destination) <= NOISE) return { ring: destination, morph: false };
    const shape = drawn ? preferred : destination;
    const centre = [shape.reduce((s, p) => s + p[0] / shape.length, 0),
                    shape.reduce((s, p) => s + p[1] / shape.length, 0)];
    const scaledTo = (k) => shape.map(([x, y]) => [centre[0] + (x - centre[0]) * k,
                                                   centre[1] + (y - centre[1]) * k]);
    let scale = 1;
    if (outside(shape) > NOISE) {
        let fits = 0.05, tooBig = 1;
        for (let i = 0; i < 24; i++) {
            const middle = (fits + tooBig) / 2;
            if (outside(scaledTo(middle)) <= NOISE) fits = middle; else tooBig = middle;
        }
        scale = Math.floor(fits * 1000) / 1000;     // rounded DOWN, so it really does fit
    }
    return { ring: scaledTo(scale), morph: true };
}

/* Two rings as the same number of points, both wound the same way and both starting at the point
   nearest the free bottom-right corner, so lerping them index by index turns one into the other
   instead of twisting it inside out. */
function alignRings(from, to, count) {
    const sameWinding = (ring) => {
        let doubled = 0;
        for (let i = 0; i < ring.length; i++) {
            const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % ring.length];
            doubled += x1 * y2 - x2 * y1;
        }
        return doubled > 0 ? ring : ring.slice().reverse();
    };
    const fromCorner = (ring) => {
        const wound = sameWinding(ring);
        let start = 0, best = -Infinity;
        wound.forEach(([x, y], i) => { if (x - y > best) { best = x - y; start = i; } });
        const rotated = wound.slice(start).concat(wound.slice(0, start));
        return resamplePath(rotated.concat([rotated[0]]), count);
    };
    return [fromCorner(from), fromCorner(to)];
}

// Evenly spaced along the path's own length, so the blade travels at one speed.
function resamplePath(path, count) {
    const lengths = [0];
    for (let i = 1; i < path.length; i++) {
        lengths.push(lengths[i - 1] + Math.hypot(path[i][0] - path[i - 1][0],
                                                 path[i][1] - path[i - 1][1]));
    }
    const total = lengths[lengths.length - 1];
    const out = [];
    let j = 0;
    for (let k = 0; k < count; k++) {
        const want = total * k / (count - 1);
        while (j < lengths.length - 2 && lengths[j + 1] < want) j++;
        const span = lengths[j + 1] - lengths[j] || 1;
        const t = Math.max(0, Math.min(1, (want - lengths[j]) / span));
        out.push([path[j][0] + (path[j + 1][0] - path[j][0]) * t,
                  path[j][1] + (path[j + 1][1] - path[j][1]) * t]);
    }
    return out;
}

/* Which ring of a template is the visible cloth. The CORPUS: the strip between the hem cut and
   the body cut is folded in half and sewn on as the mast sleeve, so it is not flat cloth. A
   template with a single cut line and no corpus falls back to its widest ring. */
function sortedRings(shape) {
    return shape.netto.map(points => ({ points, area: ringArea(points) }))
                      .sort((a, b) => b.area - a.area);
}

function outlineOf(shape, scale) {
    const ring = (shape.corpus && shape.corpus.length)
        ? shape.corpus[0] : sortedRings(shape)[0].points;
    return ring.map(([x, y]) => [x * scale, y * scale]);
}

/* ── The cut ─────────────────────────────────────────────────────────────────
   Returns a per-frame runner, or null when this page is not a cutting page. Everything it needs
   is passed in: it wants the scene's numbers, not build()'s 1300-line scope. The runner returns
   the BEAT it is playing, because the camera is part of the choreography and lives out there.

   `stages` is the roll — the sheet first, this template's own outline last, one cut between each
   neighbouring pair. What comes away at every stage is difference(SOURCE, DESTINATION) from a real
   boolean library, and every frame only ever INTERSECTS with that. Three earlier attempts
   reconstructed the waste side by hand and each one, somewhere, kept the scrap and dropped the
   banner. This cannot: everything the animation removes is by construction part of the true
   offcut.

   The waste no longer leaves the shot either. It falls at real g onto the bench at the foot of the
   frame, drapes over the bench's front edge the way leftover cloth is left on a cutting table, and
   stays there — one heap per stage — until the brand mark rolls across and pushes the lot off the
   end. Then a fresh sheet slides in and the roll repeats. */
function installCut({ S, stages, finished, morphs, box, clothW, clothH,
                      paintSilhouette, clothMaterial, group, front, showTrim, rig, sheetRig,
                      sheetTunnel, poleTravel, flag, brand }) {
    if (!stages || stages.length < 2 || !window.polygonClipping) return null;
    const clip = window.polygonClipping;
    const cuts = stages.length - 1;

    /* Where two outlines share a stretch, difference() emits a crumb per coincident vertex pair.
       Play A and Play C are the SAME shape above 800 mm and differ only in the bottom-right
       corner, so their difference comes back as one real 911 cm² piece plus 52 crumbs totalling
       22 mm². Those are arithmetic, not cloth. The threshold names what it dropped, because a rule
       that decides what counts as real has to be able to say what it excluded. */
    const REAL_PIECE = 0.002;               // of that stage's own source area
    /* How near a point has to be to count as lying ON an edge the source already has. */
    const ON_EXISTING_EDGE = 3 * S;
    const CUT_FRAMES = 120;
    // Real g. One scene unit is 100 mm, so 9.81 m/s² is 98.1 units/s².
    const GRAVITY = 98.1;

    /* ── The roll, beat by beat ──
       The shop owner's own script, in order: each flag takes its turn in front of the camera, then
       the pole comes out, the blade runs, the waste drops to the bench, the pole goes back in, and
       the next flag takes its turn. After the last one the mark clears the bench, the finished flag
       slides out and a fresh sheet slides in. Held as ONE table because the timing IS the
       choreography; scattered through the runner it becomes impossible to retune. */
    const PRESENT = 3.8, SQUARE = 0.7, POLE = 0.6, CUT_SECONDS = 3.4, SETTLE = 1.35;
    const SWEEP = 2.6, SLIDE_OUT = 0.85, SLIDE_IN = 0.95;
    /* GROW only exists for a destination that had to be cut undersized; when every shape in the
       roll fits as drawn, it is skipped and costs nothing. */
    const GROW = morphs ? 1.3 : 0;
    const beats = [];
    let running = 0;
    const beat = (kind, seconds, stage) => {
        beats.push({ kind, stage, from: running, to: running + seconds, span: seconds });
        running += seconds;
    };
    /* The pole comes out ONCE and goes back in ONCE, around the FIRST cut only: the sheet is taken
       off the Regular's frame, cut, and what comes out of it is hung on the Vento mast. The two
       cuts after that happen with that mast standing (the shop, 2026-09-01: "no more flagpole funny
       business"). Without a frame of its own for the sheet there is nothing to swap, so the mast
       simply stays up for the whole roll. */
    for (let i = 0; i < cuts; i++) {
        beat('present', PRESENT, i);
        /* SQUARE UP. The blade only ever works on a flag that is face-on and still: awers to the
           camera, flat, no turn, no wind (the shop, 2026-09-01). This beat is where the turn eases
           back to a whole number of revolutions and the camera comes round to straight-on, so that
           nothing is moving by the time anything is cut. */
        beat('square', SQUARE, i);
        if (i === 0 && sheetRig) beat('poleOut', POLE, i);
        beat('cut', CUT_SECONDS, i);
        beat('settle', SETTLE, i);
        if (i === 0 && sheetRig) beat('poleIn', POLE, i);
    }
    if (GROW) beat('grow', GROW, cuts);
    beat('present', PRESENT, cuts);
    beat('sweep', SWEEP, cuts);
    beat('slideOut', SLIDE_OUT, cuts);
    beat('slideIn', SLIDE_IN, cuts);
    const CYCLE = running;

    const eased = (k) => k * k * (3 - 2 * k);

    /* The piece that was cut becoming the piece that was ordered. A morph and not a scale: the two
       are different outlines, so there is no factor that takes one to the other. The mast, the base
       and the guide lines stand at true size throughout — they are what it grows into. */
    const MORPH_STEPS = 24;                 // a 2048-wide mask repaint is not free
    const [morphFrom, morphTo] = morphs ? alignRings(stages[cuts], finished, 260) : [null, null];
    const morphedAt = (step) => {
        const t = step / MORPH_STEPS;
        const smoothed = eased(t);
        return morphFrom.map(([x, y], i) => [x + (morphTo[i][0] - x) * smoothed,
                                             y + (morphTo[i][1] - y) * smoothed]);
    };

    /* ── One stage's geometry ──
       Where the blade travels: EVERY stretch of the destination outline that is not already an edge
       of the source. A Play A and the Regular share their bottom hem and a knife has nothing to do
       there; a Play B parts from a Play C in two separate places. Each stretch is one STROKE, and
       each keeps the shared point at either end — a straight edge is two points long, so dropping
       the points that sit on it deletes the whole edge (that is what hid the Regular's right-hand
       side). Taking only the longest stretch left a two-piece offcut's second piece on a stretch
       the blade never visited. */
    function planGeometry(index) {
        const cutSource = stages[index], fabric = stages[index + 1];
        const sourceArea = ringArea(cutSource);
        const everything = clip.difference(closedRing(cutSource), closedRing(fabric));
        const waste = everything.filter(poly => ringArea(poly[0]) / sourceArea >= REAL_PIECE);
        if (waste.length !== everything.length) {
            const crumbs = everything.length - waste.length;
            const area = everything.filter(poly => ringArea(poly[0]) / sourceArea < REAL_PIECE)
                                   .reduce((sum, poly) => sum + ringArea(poly[0]), 0);
            console.info(`cut ${index + 1}/${cuts}: ignored ${crumbs} coincident-edge crumb(s), ` +
                         `${(area * 1e4).toFixed(1)} mm² in total`);
        }
        if (!waste.length) return null;

        const shared = fabric.map(p => projectOnRing(cutSource, p).distance <= ON_EXISTING_EDGE);
        const strokes = [];
        const firstShared = shared.indexOf(true);
        if (firstShared === -1) {
            strokes.push(fabric.concat([fabric[0]]));      // nothing is shared: cut the whole ring
        } else {
            let stroke = [], anchor = null;
            for (let k = 0; k <= fabric.length; k++) {
                const i = (firstShared + k) % fabric.length;
                if (shared[i]) {
                    if (stroke.length) { stroke.push(fabric[i]); strokes.push(stroke); stroke = []; }
                    anchor = fabric[i];
                } else {
                    if (!stroke.length && anchor) stroke.push(anchor);
                    stroke.push(fabric[i]);
                }
            }
            if (stroke.length > 1) strokes.push(stroke);
        }
        if (!strokes.length) return null;

        /* The free corner is the bottom-right: the one the wind moves and the one a cutter reaches
           for. Each stroke runs from its far end TOWARDS that corner, and the strokes are ordered
           the same way, so the knife works inwards to the corner the offcut will hang from
           (shop rule, 2026-09-01 — this ran the other way round until it was asked to be flipped). */
        const freeCorner = cutSource.reduce((a, b) => (b[0] - b[1] > a[0] - a[1] ? b : a));
        const toCorner = (p) => (p[0] - freeCorner[0]) ** 2 + (p[1] - freeCorner[1]) ** 2;
        for (const stroke of strokes) {
            if (toCorner(stroke[stroke.length - 1]) > toCorner(stroke[0])) stroke.reverse();
        }
        strokes.sort((a, b) => toCorner(b[0]) - toCorner(a[0]));
        /* Constant blade speed, with the points shared out by real length so a long stroke is not
           rushed to keep pace with a short one. The stored outline is hundreds of points around a
           curve and two points down a straight side, so raw point order crawls the curve and
           teleports the edge. */
        const lengthOf = (r) => r.reduce(
            (sum, p, i) => (i ? sum + Math.hypot(p[0] - r[i - 1][0], p[1] - r[i - 1][1]) : 0), 0);
        const totalLength = strokes.reduce((sum, r) => sum + lengthOf(r), 0) || 1;
        let cutPath = [];
        for (const stroke of strokes) {
            cutPath = cutPath.concat(resamplePath(
                stroke, Math.max(2, Math.round(220 * lengthOf(stroke) / totalLength))));
        }
        if (cutPath.length <= 2) return null;

        /* Freeing is decided PER OFFCUT PIECE, against that piece's own ring. A single closure
           walking the SOURCE boundary between the two ends of the whole cut spans pieces the blade
           has not reached — that is what made a two-piece stage free area backwards. Every piece
           here is entirely waste, so a wrong closure can only free LESS of that piece; it can never
           reach the banner. */
        const bannerInside = fabric.reduce(
            (a, p) => [a[0] + p[0] / fabric.length, a[1] + p[1] / fabric.length], [0, 0]);
        // When the blade first and last runs along each piece's own boundary.
        const pieces = waste.map((polygon) => {
            const ring = openRing(polygon[0]);
            let first = Infinity, last = -Infinity;
            for (let i = 0; i < cutPath.length; i++) {
                if (projectOnRing(ring, cutPath[i]).distance <= ON_EXISTING_EDGE) {
                    if (i < first) first = i;
                    if (i > last) last = i;
                }
            }
            /* Nothing separates until the stroke closes, and that is not a fallback — it is what
               happens when the offcut SURROUNDS the destination. A shape cut out of the middle of
               another leaves a frame, whose outer edge is the sheet's own and whose inner edge is
               the cut; a frame holds together right up to the moment the cut meets itself. The test
               above looks at the outer ring only, so exactly those pieces land here. */
            if (first === Infinity) { first = cutPath.length - 2; last = cutPath.length - 1; }
            return { polygon, ring, first, last };
        });

        const wastePoints = waste.flat().flat();
        return {
            index, cutSource, fabric, waste, cutPath, pieces, bannerInside, steps: [],
            left: Math.min(...wastePoints.map(p => p[0])),
            right: Math.max(...wastePoints.map(p => p[0])),
            top: Math.max(...wastePoints.map(p => p[1])),
            bottom: Math.min(...wastePoints.map(p => p[1])),
        };
    }

    // Both halves are stored, freed AND kept: the kept half used to be recomputed in the frame
    // loop, which meant a ~3 ms boolean ran sixty times a second to feed a cache check.
    function stepAt(plan, headLength) {
        const freed = [];
        for (const piece of plan.pieces) {
            if (headLength <= piece.first) continue;               // not reached yet
            if (headLength > piece.last) { freed.push(piece.polygon); continue; }
            const head = plan.cutPath.slice(piece.first, headLength);
            if (head.length < 2) continue;
            const a = projectOnRing(piece.ring, head[0]);
            const b = projectOnRing(piece.ring, head[head.length - 1]);
            const forward = head.concat(walkRing(piece.ring, b, a));
            const backward = head.concat(walkRing(piece.ring, a, b).reverse());
            let candidate = pointInRing(forward, plan.bannerInside) ? backward : forward;
            if (pointInRing(candidate, plan.bannerInside)) {
                candidate = ringArea(forward) < ringArea(backward) ? forward : backward;
            }
            try {
                freed.push(...clip.intersection([piece.polygon], closedRing(candidate)));
            } catch (error) {
                // a degenerate step frees nothing from this piece, which is not a crash
            }
        }
        const rings = freed.flat();
        return { freed: rings,
                 kept: rings.length ? clip.difference(closedRing(plan.cutSource), freed).flat()
                                    : [plan.cutSource] };
    }

    /* ── One stage's offcut mesh ──
       Its own plane rather than a clone of the cloth's: it never takes wind, so it does not need
       the cloth's segment count, and every vertex it carries is paid for twice — once in the hinge
       search below and again in computeVertexNormals on every frame of the cut. Same size and same
       UVs as the cloth, so it wears the printed sheet exactly as the cloth does. */
    /* Enough segments across the piece to carry the folds of the drape: at 20 a fold spanned four
       quads and read as a crease rather than a curve. */
    const OFFCUT_ACROSS = 36;
    /* The cloth is the front layer now — it lies across the page and is looked AT, not glimpsed
       falling — so its silhouette gets resolution to match. Two meshes share each mask, so this is
       one canvas per stage and not two. */
    const OFFCUT_MASK_WIDTH = 1024;

    function dress(plan) {
        const geometry = new THREE.PlaneGeometry(
            clothW, clothH, OFFCUT_ACROSS,
            Math.min(72, Math.round(OFFCUT_ACROSS * clothH / clothW)));
        geometry.translate(box.x0 + clothW / 2, box.y0 + clothH / 2, 0);
        const mesh = new THREE.Mesh(geometry, clothMaterial.clone());
        const mask = silhouette(OFFCUT_MASK_WIDTH,
                                Math.min(4096, Math.round(OFFCUT_MASK_WIDTH * clothH / clothW)));
        mesh.material.alphaMap = mask.texture;
        mesh.material.needsUpdate = true;
        mesh.visible = false;

        /* Pinned at the offcut's OWN middle. Rotating the mesh itself turns it about the plane's
           centre, which is not on the piece — that is what threw the offcut sideways out of shot
           instead of dropping it. */
        const dropX = (plan.left + plan.right) / 2, dropY = (plan.bottom + plan.top) / 2;
        const falling = new THREE.Group();
        falling.position.set(dropX, dropY, 0);
        mesh.position.set(-dropX, -dropY, 0);
        falling.add(mesh);
        group.add(falling);

        /* The SAME piece where it ends up: its own mesh in the front layer, wearing the same
           silhouette mask and the same print. Two meshes and not one, because the two live in
           different worlds — the peeling one is on the flag, in perspective, turning with it; this
           one lies over the bottom edge of the frame in a flat orthographic layer that the flag's
           camera knows nothing about. Nobody follows a falling strip pixel for pixel across that
           boundary; what reads is that it fell, and is now here. */
        const restGeometry = new THREE.PlaneGeometry(
            clothW, clothH, OFFCUT_ACROSS,
            Math.min(72, Math.round(OFFCUT_ACROSS * clothH / clothW)));
        restGeometry.translate(box.x0 + clothW / 2, box.y0 + clothH / 2, 0);
        const restMesh = new THREE.Mesh(restGeometry, clothMaterial.clone());
        restMesh.material.alphaMap = mask.texture;
        restMesh.material.aoMap = null;             // the hem AO belongs to the flag, not to scrap
        restMesh.material.needsUpdate = true;
        restMesh.visible = false;
        front.add(restMesh);

        /* Which stroke of the cut freed each vertex, and which way the blade was pointing there.
           Computed once: it is the plane's own grid against the path, and neither moves. The
           direction is the hinge the freed cloth folds over. */
        const flat = geometry.attributes.position.array.slice();
        const vertexCount = geometry.attributes.position.count;
        const hinge = new Uint16Array(vertexCount);
        const freedWhen = new Float32Array(vertexCount);
        for (let v = 0; v < vertexCount; v++) {
            const x = flat[v * 3], y = flat[v * 3 + 1];
            let best = Infinity, bestStep = 0;
            for (let i = 0; i < plan.cutPath.length; i++) {
                const d = (plan.cutPath[i][0] - x) ** 2 + (plan.cutPath[i][1] - y) ** 2;
                if (d < best) { best = d; bestStep = i; }
            }
            hinge[v] = bestStep;
            freedWhen[v] = bestStep / (plan.cutPath.length - 1);
        }
        const alongX = new Float32Array(plan.cutPath.length);
        const alongY = new Float32Array(plan.cutPath.length);
        for (let i = 0; i < plan.cutPath.length; i++) {
            const a = plan.cutPath[Math.max(0, i - 1)];
            const b = plan.cutPath[Math.min(plan.cutPath.length - 1, i + 1)];
            const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
            alongX[i] = dx / len;
            alongY[i] = dy / len;
        }
        Object.assign(plan, { geometry, mesh, mask, falling, dropX, dropY, flat, vertexCount,
                              hinge, freedWhen, alongX, alongY, shownMask: null, landed: 0,
                              sagged: null, restGeometry, restMesh, draped: false,
                              midX: (box.x0 + box.x1) / 2 });
        drape(plan);            // its resting pose never changes, so write it once and leave it
    }

    /* Cloth the blade has passed is held only by whatever is still uncut above it: it peels off the
       plane along the cut line and it sags. Both grow with the SQUARE of the time since it came
       loose, because acceleration is what the eye reads as weight — the first version moved every
       freed vertex by the same amount and then stopped, which looked like a wipe. The ceilings are
       the attachment itself; cloth still joined above cannot fall further than the join lets it. */
    const LOOSE_FULL = 1.1;                  // seconds to reach the ceilings
    const HELD_SAG = clothH * 0.15;
    const PEEL_MAX = 1.15;                   // radians it folds off the plane
    function sagOffcut(plan, progress) {
        const position = plan.geometry.attributes.position;
        for (let v = 0; v < plan.vertexCount; v++) {
            const x = plan.flat[v * 3], y = plan.flat[v * 3 + 1];
            const loose = Math.max(0, progress - plan.freedWhen[v]) * CUT_SECONDS;
            if (loose <= 0) {
                position.array[v * 3] = x;
                position.array[v * 3 + 1] = y;
                position.array[v * 3 + 2] = 0;
                continue;
            }
            const weight = Math.min(loose / LOOSE_FULL, 1) ** 2;
            const i = plan.hinge[v];
            const hx = plan.cutPath[i][0], hy = plan.cutPath[i][1];
            const ux = plan.alongX[i], uy = plan.alongY[i];
            const rx = x - hx, ry = y - hy;
            const along = ux * rx + uy * ry;
            /* Rodrigues about the cut line, which lies in the plane, so the only new depth comes
               from the component across it. Written out rather than through Vector3.applyAxisAngle
               on purpose: this is every vertex of every frame, and that call would allocate two
               vectors each time round. */
            const turn = PEEL_MAX * weight;
            const c = Math.cos(turn), s = Math.sin(turn);
            position.array[v * 3] = hx + rx * c + ux * along * (1 - c);
            position.array[v * 3 + 1] = hy + ry * c + uy * along * (1 - c) - HELD_SAG * weight;
            position.array[v * 3 + 2] = (ux * ry - uy * rx) * s;
        }
        position.needsUpdate = true;
        plan.geometry.computeVertexNormals();
    }

    /* ── Where the cloth ends up ──
       Folded over the bottom edge of the frame — the bottom of the hero, on a page — with NO TABLE
       under it (the shop, 2026-09-01). Written in the FRONT layer's own coordinates: x across the
       frame from its middle, y zero AT that edge and negative below it, z towards the viewer. So
       "hangs over the edge" is literally y going negative, and the orthographic front camera puts
       y = 0 on the boundary pixel exactly.

       A long strip cannot hang its whole length: the Regular's first offcut is 2.3 m of cloth and
       would run off the bottom of the page. So past the drop the length GATHERS, which is what
       fabric does when more of it arrives than there is room to hang.

       FOLDS ACROSS THE WIDTH are the whole difference between hanging cloth and hanging card, and
       card is what the first version looked like. Nothing where it lies back over the edge, held
       flat by the weight of everything behind it; growing as it goes down, where nothing holds it
       at all. Each piece carries its own phase and its own tilt, so three of them over one edge
       read as three cloths rather than one thick one.

       Written once, when the piece is built: a resting pose that never changes is static geometry
       and costs nothing for the rest of the roll. */
    const OVER = 0.75;                       // how much lies back over the edge, above the line
    const DROP = 4.4;                        // how far it hangs below the line
    const GATHER = 0.7;                      // the coil the remaining length gathers into
    const GATHER_PITCH = 1.0;                // one fold of that coil
    const STACK = 0.4;                       // each piece lies a little in front of the last
    /* Fold pitch in the CLOTH's own terms, not in absolute units: the first offcut off a Regular is
       a full-width band and the last is a corner scrap, and a fixed pitch gave the wide one four
       lazy waves and the narrow one none at all. */
    const FOLD_PITCH = clothW / 7;           // one fold across the width
    const FOLD_DEPTH = 0.42;                 // how far a fold stands off the plane at full hang
    function drapedAt(plan, v) {
        const raw = plan.flat[v * 3];
        const across = raw - plan.midX;
        const ahead = plan.index * STACK;
        // A slight tilt over the edge, different per piece: cloth is never laid down square.
        const tilt = (plan.index - 1) * 0.05;
        const s = Math.max(0, plan.top - plan.flat[v * 3 + 1] + (raw - plan.left) * tilt);
        if (s < OVER) {
            // Lying back over the edge, away from the viewer: the fold that sells the weight.
            const back = OVER - s;
            return [across, back * 0.28, ahead - back];
        }
        const down = s - OVER;
        const loose = Math.min(down / DROP, 1);
        const fold = Math.sin(across / FOLD_PITCH * 2 * Math.PI + plan.index * 2.1)
                     * FOLD_DEPTH * loose;
        // A fold eats length, so fabric taken up sideways rides back up — which is what gives a
        // hanging cloth its uneven bottom edge instead of a ruled one.
        const takenUp = Math.abs(fold) * 0.35;
        if (down < DROP) return [across, -down + takenUp, ahead + fold];
        const turn = (down - DROP) / GATHER_PITCH * 2 * Math.PI;
        return [across, -DROP - GATHER * (0.5 - 0.5 * Math.cos(turn)) + takenUp,
                ahead + fold + GATHER * 0.7 * Math.sin(turn)];
    }

    function drape(plan) {
        const position = plan.restGeometry.attributes.position;
        for (let v = 0; v < plan.vertexCount; v++) {
            const [x, y, z] = drapedAt(plan, v);
            position.array[v * 3] = x;
            position.array[v * 3 + 1] = y;
            position.array[v * 3 + 2] = z;
        }
        position.needsUpdate = true;
        plan.restGeometry.computeVertexNormals();
        /* And the bounds, or the piece is never drawn. Every vertex above has just been moved out of
           the flag's world and into the front layer's, but the geometry's bounding sphere is still
           the one computed from the flat plane — so three.js frustum-culls the mesh against a sphere
           nowhere near where the cloth now is, and the front layer renders an empty scene while
           reporting three visible meshes. */
        plan.restGeometry.computeBoundingSphere();
        plan.restGeometry.computeBoundingBox();
    }

    /* Arriving is a DROP, not an appearance: the cloth comes in from above the edge and settles,
       with the last of it easing out rather than stopping dead. */
    const ARRIVE = 4.2;                      // how far above its resting place it comes in from
    const ARRIVE_AT = 0.34;                  // how far into the settle the front layer takes over
    function arriveCloth(plan, k) {
        const settled = eased(Math.min(Math.max(k, 0), 1));
        plan.restMesh.visible = k > 0;
        plan.restMesh.position.y = (1 - settled) * ARRIVE;
        // A touch of roll as it lands, alternating, so two pieces never arrive the same way.
        plan.restMesh.rotation.z = (1 - settled) * 0.07 * (plan.index % 2 ? 1 : -1);
    }

    /* ── The mark that clears the bench ──
       The brand's own signet, rolling across the page and shoving the day's waste off the end. The
       logo is CONFIGURATION, never content (PREPRESS_BRAND_LOGO) — a shop's mark belongs to the
       shop — and with none set the disc wears the brand NAME, exactly as the page header does. The
       wordmark is painted first and the image replaces it if and when it loads, so a blocked or
       cross-origin logo degrades to something readable instead of to a blank coin. */
    function brandFace() {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 512;
        const face = canvas.getContext('2d');
        const clear = () => {
            face.clearRect(0, 0, 512, 512);
            face.fillStyle = '#ffffff';
            face.beginPath();
            face.arc(256, 256, 250, 0, Math.PI * 2);
            face.fill();
        };
        clear();
        face.fillStyle = '#14161a';
        face.font = '700 58px system-ui, Segoe UI, sans-serif';
        face.textAlign = 'center';
        face.textBaseline = 'middle';
        face.fillText(brand.name || 'prepress-open', 256, 256, 400);
        const texture = new THREE.CanvasTexture(canvas);
        if (brand.logo) {
            const image = new Image();
            image.crossOrigin = 'anonymous';
            image.onload = () => {
                clear();
                const fit = Math.min(330 / image.width, 330 / image.height);
                face.drawImage(image, 256 - image.width * fit / 2, 256 - image.height * fit / 2,
                               image.width * fit, image.height * fit);
                texture.needsUpdate = true;
            };
            image.onerror = () => { /* the wordmark already painted is the correct fallback */ };
            image.src = brand.logo;
        }
        return texture;
    }

    /* Big enough to read as the brand rather than as a bead on a rail, and it rides LOW: the cloth
       hangs BELOW the edge, so a disc rolling along the edge itself would clear the very thing it is
       supposed to be shoving off. In the FRONT layer, in front of every piece of cloth there. */
    const MARK_RADIUS = 2.1;
    const MARK_RIDE = -1.4;                  // its centre, relative to the edge (front-layer y)
    const markGeometry = new THREE.CylinderGeometry(MARK_RADIUS, MARK_RADIUS, 0.24, 40);
    // A cylinder stands on its own +y; turned onto its side its faces meet the camera and it rolls
    // about z, which is the axis the sweep spins.
    markGeometry.rotateX(Math.PI / 2);
    const markFace = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5,
                                                      map: brandFace(), transparent: true });
    const mark = new THREE.Mesh(markGeometry, [
        new THREE.MeshStandardMaterial({ color: 0x1d2026, roughness: 0.7 }),
        markFace, markFace]);
    mark.visible = false;
    front.add(mark);
    /* Right across the frame and out the other side. The front layer's own width, not the flag's:
       these are front-layer coordinates, centred on the frame. */
    const frameHalf = () => Math.max(clothW / 2 / 0.82, clothW / 2) + MARK_RADIUS + 1.5;

    /* ── Precompute, off the critical path and in small bites ──
       Two booleans a step is ~6 ms, and 120 of them in one macrotask froze the page for a third of
       a second on the office Intel HD 530. With a roll of stages there is more of it, so it is
       queued: the stage in hand finishes first and the rest fill in behind it while that one plays.
       Each stage takes about nine seconds of the roll and about a second and a half to prepare, so
       the queue stays well ahead — and when it does not, the clock WAITS (see the runner) rather
       than skipping a cut nobody got to see. */
    const PER_TICK = 6;
    const plans = new Array(cuts).fill(null);
    let building = 0;
    const precompute = () => {
        while (building < cuts && plans[building] === false) building += 1;
        if (building >= cuts) return;
        if (plans[building] === null) {
            const plan = planGeometry(building);
            if (!plan) { plans[building] = false; building += 1; setTimeout(precompute, 0); return; }
            dress(plan);
            plans[building] = plan;
            setTimeout(precompute, 0);
            return;
        }
        const plan = plans[building];
        const until = Math.min(plan.steps.length + PER_TICK, CUT_FRAMES);
        while (plan.steps.length < until) {
            plan.steps.push(stepAt(
                plan, Math.round(plan.cutPath.length * (plan.steps.length + 1) / CUT_FRAMES)));
        }
        if (plan.steps.length >= CUT_FRAMES) building += 1;
        setTimeout(precompute, 0);
    };
    setTimeout(precompute, 0);
    const ready = (index) => plans[index] === false
        || (plans[index] && plans[index].steps.length >= CUT_FRAMES);

    /* The offcut is the SAME printed sheet, so it wears whatever the cloth is wearing. The artwork
       arrives asynchronously and lands on clothMaterial after these clones were taken, which is why
       the freed strip came away blank on the first run. */
    function matchCloth() {
        for (const plan of plans) {
            if (!plan || plan.mesh.material.map === clothMaterial.map) continue;
            for (const worn of [plan.mesh.material, plan.restMesh.material]) {
                worn.map = clothMaterial.map;
                worn.color.copy(clothMaterial.color);
                worn.needsUpdate = true;
            }
        }
    }

    const blades = shears(1.35);
    blades.visible = false;
    group.add(blades);

    /* A frame slides straight down out of the shot and back up: a flag comes OFF its mast to be
       cut, which is both what the owner asked for and what a cutter does with one. Two of them —
       the sheet's rigid Regular frame and this template's own mast — and never both at once. */
    function standPoles(sheetDown, mastDown) {
        if (sheetRig) {
            sheetRig.position.y = -poleTravel * sheetDown;
            sheetRig.visible = sheetDown < 0.999;
        }
        rig.position.y = -poleTravel * mastDown;
        rig.visible = mastDown < 0.999;
    }
    // With no frame for the sheet there is nothing to swap: this template's mast stands throughout.
    const MAST_ONLY = sheetRig ? 1 : 0;
    /* Set before the first beat can run. The roll spends its first seconds precomputing, and until
       it does the runner returns without touching anything — which left BOTH frames standing in the
       same flag. */
    standPoles(0, MAST_ONLY);

    function restart() {
        for (const plan of plans) {
            if (!plan) continue;
            plan.mesh.visible = false;
            plan.shownMask = null;
            plan.sagged = null;             // the next roll peels it again from flat
            plan.falling.position.set(plan.dropX, plan.dropY, 0);
            plan.falling.rotation.z = 0;
            plan.mesh.position.set(-plan.dropX, -plan.dropY, 0);
            // The front layer goes back to empty: nothing has fallen onto the page yet.
            plan.draped = false;
            plan.restMesh.visible = false;
            plan.restMesh.position.set(0, 0, 0);
            plan.restMesh.rotation.z = 0;
        }
        mark.visible = false;
        blades.visible = false;
        flag.position.x = 0;
        standPoles(0, MAST_ONLY);        // a fresh sheet arrives on the sheet's own frame
        showTrim(false);
    }

    /* Both masks are 1000+ pixels wide and re-upload to the GPU when repainted, so each is drawn
       only when the step it shows actually changes — a silhouette moves 120 times over three and a
       half seconds, not sixty times a second. */
    let firstFrame = 0, previousElapsed = 0, wasAt = 0, shownBanner = null;
    let holding = { kind: 'present', stage: 0, k: 0 };
    const show = (key, rings, strips) => {
        if (shownBanner === key) return;
        paintSilhouette(rings, strips);
        shownBanner = key;
    };

    return (elapsed) => {
        if (!firstFrame) { firstFrame = elapsed; previousElapsed = elapsed; }
        const delta = elapsed - previousElapsed;
        previousElapsed = elapsed;
        if (!ready(0)) { firstFrame += delta; return null; }   // still preparing the first cut
        const at = (elapsed - firstFrame) % CYCLE;
        /* A wrap, and NOT merely a clock that went backwards. Holding the clock for a cut that is
           not ready rewinds `at` by a rounding error every frame, and a plain `at < wasAt` read
           each of those as the start of a new roll: it called restart(), which swept every heap
           already on the bench off it. Only a drop of most of a cycle is a wrap. */
        if (wasAt - at > CYCLE * 0.5) { restart(); shownBanner = null; }
        wasAt = at;
        matchCloth();

        let current = beats[beats.length - 1];
        for (const one of beats) { if (at < one.to) { current = one; break; } }
        /* A cut nobody has finished preparing is worth waiting for, not skipping: hold the clock
           where it is and keep showing the flag that is already standing. */
        if ((current.kind === 'cut' || current.kind === 'poleOut') && !ready(current.stage)) {
            firstFrame += delta;
            return holding;            // hold the shot too, or the camera jumps while we wait
        }
        const k = Math.min(Math.max((at - current.from) / current.span, 0), 1);
        const plan = current.stage < cuts ? plans[current.stage] : null;
        /* Cloth that has already fallen stays exactly where it fell. Only the piece belonging to
           the beat in hand is still moving. */
        for (const done of plans) {
            if (done && done.draped && done !== plan) arriveCloth(done, 1);
        }

        switch (current.kind) {
        case 'present':
            /* This stage's flag, whole, on its pole. The SHEET stands on the Regular's rigid frame
               with its tunnel strips erased from the flat cloth, because there they are sewn round
               that frame; every later flag stands on this template's own mast. The last one is the
               ordered shape, and only then do the cut line and the safe area describe what is
               actually there. */
            if (current.stage === 0 && sheetRig) {
                show('sheet0', [stages[0]], sheetTunnel);
                standPoles(0, 1);
            } else {
                show('flag' + current.stage,
                     [current.stage === cuts ? finished : stages[current.stage]]);
                standPoles(1, 0);
            }
            showTrim(current.stage === cuts);
            blades.visible = false;
            break;

        case 'square':
            // Nothing to draw that the present before it was not already drawing; see driveLayered.
            blades.visible = false;
            break;

        case 'poleOut':
            /* Unhooked. The strips that were sewn round the frame are flat cloth again the moment
               it is off, so the silhouette stops cutting them out. */
            show('unhooked', [stages[0]], null);
            standPoles(eased(k), 1);
            break;

        case 'poleIn':
            standPoles(1, 1 - eased(k));
            break;

        case 'cut': {
            const progress = k;
            const index = Math.min(CUT_FRAMES - 1, Math.floor(progress * CUT_FRAMES));
            const step = plan.steps[index];
            show(`cut${current.stage}:${index}`, step.kept);
            if (step.freed.length) {
                if (plan.shownMask !== index) {
                    fillSilhouette(plan.mask.ctx, step.freed, box, plan.mask.canvas);
                    plan.mask.texture.needsUpdate = true;
                    plan.shownMask = index;
                }
                plan.mesh.visible = true;
                plan.falling.position.set(plan.dropX, plan.dropY, 0);
                plan.falling.rotation.z = 0;
                plan.mesh.position.set(-plan.dropX, -plan.dropY, 0);
                sagOffcut(plan, progress);
            }
            const along = Math.round(progress * (plan.cutPath.length - 1));
            const tip = plan.cutPath[Math.min(plan.cutPath.length - 1, along)];
            const behind = plan.cutPath[Math.max(0, along - 4)];
            blades.visible = true;
            blades.position.set(tip[0], tip[1], 0.05);
            blades.rotation.z = Math.atan2(tip[1] - behind[1], tip[0] - behind[0]);
            break;
        }

        case 'settle': {
            // Nothing holds it any more: this stage's flag is finished and its waste is in the air.
            blades.visible = false;
            show('freed' + current.stage, [plan.fabric]);
            if (!plan.sagged) {
                fillSilhouette(plan.mask.ctx, plan.waste.flat(), box, plan.mask.canvas);
                plan.mask.texture.needsUpdate = true;
                plan.shownMask = null;
                sagOffcut(plan, 1);                            // fully peeled, then let it go
                plan.sagged = plan.geometry.attributes.position.array.slice();
                plan.mesh.visible = true;
            }
            const seconds = k * current.span;
            // Out of the flag's band at real g, turning as it goes.
            const fallen = 0.5 * GRAVITY * seconds * seconds;
            plan.falling.position.y = plan.dropY - fallen;
            plan.falling.rotation.z = -0.55 * seconds;
            plan.mesh.visible = fallen < (plan.top - box.y0) + 8;
            /* And into the FRONT layer, arriving from above the edge while the last of it is still
               on its way down behind. The two overlap on purpose: that overlap is what reads as one
               piece of cloth falling out of the flag and landing on the page. */
            plan.draped = true;
            arriveCloth(plan, (k - ARRIVE_AT) / (1 - ARRIVE_AT));
            break;
        }

        case 'grow': {
            const step = Math.max(0, Math.min(Math.round(k * MORPH_STEPS), MORPH_STEPS));
            show('morph' + step, [morphedAt(step)]);
            standPoles(1, 0);
            break;
        }

        case 'sweep': {
            const from = -frameHalf(), to = frameHalf();
            const x = from + (to - from) * k;
            mark.visible = true;
            mark.position.set(x, MARK_RIDE, cuts * STACK + 1.6);
            mark.rotation.z = -(x - from) / MARK_RADIUS;       // rolling, not sliding
            for (const heap of plans) {
                if (!heap || !heap.draped) continue;
                // Shoved from wherever the disc has reached, and only ever forwards.
                const reach = x + MARK_RADIUS - (heap.midX - heap.left - clothW / 2);
                heap.restMesh.position.x = Math.max(heap.restMesh.position.x, reach);
            }
            break;
        }

        case 'slideOut':
            mark.visible = false;
            flag.position.x = -eased(k) * (clothW + 9);
            break;

        case 'slideIn':
            // The edge is clear, and the next sheet arrives whole and already on its own frame.
            show('sheet', [stages[0]], sheetTunnel);
            standPoles(0, MAST_ONLY);
            showTrim(false);
            for (const heap of plans) { if (heap) heap.mesh.visible = false; }
            flag.position.x = (1 - eased(k)) * (clothW + 9);
            break;
        }
        holding = { kind: current.kind, stage: current.stage, k };
        return holding;
    };
}

function build(data, cutFrom) {
    /* mm → scene units 1:100, so a 5 m flag is a 5-unit mesh. The stored outlines are in the PDF
       frame, where y grows UP — same as the scene — so NO flip here (the first version added one
       and hung every flag upside down). */
    const S = 0.01;

    const rings = sortedRings(data);              // the guide lines below draw every one of them
    const fabric = outlineOf(data, S);

    /* The roll: every shape being cut FROM, laid the way a cutter lays them — ALL the corpuses
       meet at their BOTTOM-RIGHT corners (shop rule, 2026-08-31). That corner is the one they all
       share — the free corner, away from the mast — and nesting there is what makes each leftover
       a single piece instead of a frame wrapped round the banner.

       Stages run sheet first, this template's own outline last. */
    /* Reduced motion turns the roll off entirely: a flag being cut apart every half minute behind
       somebody's reading is precisely what that setting exists to stop, and the page then shows this
       template as itself, which is what it is. Read here rather than through `bare`/`calm` further
       down — those are declared below and a const used above its declaration is a TDZ
       ReferenceError, which has killed this file twice already. */
    const rolling = !(document.body.classList.contains('bare')
                      && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    let stages = null, cutFit = null;
    if (rolling && cutFrom.length && window.polygonClipping) {
        const clip = window.polygonClipping;
        const anchorX = Math.max(...fabric.map(p => p[0]));
        const anchorY = Math.min(...fabric.map(p => p[1]));
        const nested = cutFrom.map((shape) => {
            const raw = outlineOf(shape, S);
            const toRight = anchorX - Math.max(...raw.map(p => p[0]));
            const toBottom = anchorY - Math.min(...raw.map(p => p[1]));
            return raw.map(([x, y]) => [x + toRight, y + toBottom]);
        });
        /* A Drop is not a trimmed Play B: 400 cm² of it lies OUTSIDE, so no cut produces one.
           It is cut as the template's own `transform` shape — slimmer, drawn for this — and that
           is transformed into the real outline once the scrap is gone (shop rule, 2026-09-01).
           Every other pair fits as it is, and this returns the destination unchanged. */
        cutFit = fitInside(fabric, nested[nested.length - 1],
                           (data.transform || []).map(([x, y]) => [x * S, y * S]));
        stages = nested.concat([cutFit.ring]);
        /* The hairline clamp, and it runs BACKWARDS from the last ring so that every stage's
           source really does contain its own destination. It is not a design choice: after the
           corners meet, two bottom edges still differ by hundredths of a millimetre, and a
           destination poking outside its source makes "offcut = source minus destination" no
           longer the offcut. Measured on the four-flag roll it adds 3.03, 1.18 and 0.00 cm² —
           hairlines, and enough to keep every stage a clean single-piece cut. */
        for (let i = stages.length - 2; i >= 0; i--) {
            stages[i] = openRing(clip.union(closedRing(stages[i]), closedRing(stages[i + 1]))
                .flat().sort((a, b) => ringArea(b) - ringArea(a))[0]);
        }
    }

    /* Two layers exist exactly when a roll does: without one there is no cloth to hang and the
       flag gets the whole canvas, as it always did. */
    const layered = !!stages;

    // The plane has to hold EVERY shape in the roll, or the biggest is clipped by a canvas sized
    // for a later one. Without a cut this is exactly the fabric's own box, as before.
    const framed = stages ? fabric.concat(...stages) : fabric;
    const xs = framed.map(p => p[0]), ys = framed.map(p => p[1]);
    const box = { x0: Math.min(...xs), x1: Math.max(...xs),
                  y0: Math.min(...ys), y1: Math.max(...ys) };
    const clothW = box.x1 - box.x0, clothH = box.y1 - box.y0;

    /* Dominance tolerance for the sleeve edge (the Pareto frontier of the outline): a real corpus
       edge BOWS a few millimetres, and with zero tolerance an 11 mm bow on the Play A disqualified
       the lower quarter of the edge — the mast entered the flag mid-height and the hem band was
       painted onto the tunnel side. The outline only contains boundary points, so a tolerance
       comfortably above any bow and below the shoulder's real step keeps the frontier honest. */
    const SLEEVE_EDGE_TOLERANCE = 15 * S;

    /* The Regular's tunnels, measured off its own cut outline: the notch in the top-left corner
       exists so the elbow clears the fabric, so its width IS the left tunnel and its height IS
       the top one. The strips wrap the rigid frame as full sleeves (The shop: NOT folded in
       half), so they are not flat cloth — they are erased from the silhouette below and built as
       fabric cylinders in the mast block. */
    const construction = data.construction || (data.rigid ? 'rigid' : 'winder');
    let tunnel = null;
    if (construction === 'top') {
        // The hung flag: the only tunnel is the top one, its width straight from the template.
        tunnel = { h: ((data.sewn_sides_mm || {}).top || 130) * S };
    }
    if (data.rigid) tunnel = tunnelsOf(fabric, box, clothW, S);

    /* Hero mode: the decorative strip behind the landing copy, as opposed to the page you open
       to inspect a template. It buys a cheaper material, a coarser cloth and a lower render
       resolution, because the office PC is an Intel HD 530 and the full fabric shader gave it
       9 fps. Declared HERE, above everything that reads it: a const used before its declaration
       is a TDZ ReferenceError, which has killed this file twice already. */
    const HERO = document.body.classList.contains('bare');

    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    /* Resolution is the hero's whole quality budget, and the right number depends on the machine.
       Rather than pick one that is soft everywhere so the slowest device survives, the hero starts
       at full device resolution and walks DOWN this ladder if it cannot hold ~45 fps. Measured,
       not assumed: the office PC (Intel HD 530) settles near the bottom, anything newer stays at
       the top. The inspectable pages are not on the ladder — they render sharp and that is that. */
    const QUALITY = [Math.min(window.devicePixelRatio, 2),
                     Math.min(window.devicePixelRatio, 1.5),
                     1, 0.75, 0.55];
    /* A layered hero does not get the bottom of that ladder. The cloth lies ON the page at reading
       distance, where 0.55 of a pixel is visibly mush; the flag behind it could take the softening
       but they share one canvas, so the floor is set by whichever needs it sharper. */
    const QUALITY_FLOOR = 2;
    let qualityStep = 0;
    renderer.setPixelRatio(HERO ? QUALITY[0] : Math.min(window.devicePixelRatio, 2));
    stage.appendChild(renderer.domElement);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 200);
    const controls = new OrbitControls(camera, renderer.domElement);

    /* ── The front layer ──
       Nothing but the cloth that came off the flag, and the mark that clears it away. Its own scene
       and its own camera, drawn AFTER the back one and over the whole canvas, so it sits in front of
       the flag and can hang past the band the flag is confined to — over whatever the page puts
       below its hero.

       ORTHOGRAPHIC on purpose. A foreground layer whose job is to lie over a boundary must not be
       foreshortened, and with no perspective one world unit is a fixed number of pixels — which is
       the only way the fold line lands exactly on that boundary instead of near it. */
    const front = new THREE.Scene();
    front.add(new THREE.HemisphereLight(0xf4f6ff, 0x24262a, 0.8));
    const frontKey = new THREE.DirectionalLight(0xffffff, 1.6);
    frontKey.position.set(-1.1, 2.4, 3.2);
    front.add(frontKey);
    const frontRim = new THREE.DirectionalLight(0xdfe8ff, 0.45);
    frontRim.position.set(2.2, -1.0, 1.5);
    front.add(frontRim);
    const frontCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
    // Stood back along +z looking the usual way, rather than sitting at the origin with a negative
    // near plane: the cloth's own folds cross z = 0 in both directions.
    frontCamera.position.set(0, 0, 120);
    /* How wide the fallen cloth lies across the frame. Premium reads as BIG: a length of real
       fabric over the page, not a swatch pinned to it. */
    const FRONT_SPAN = 0.82;
    // How tall the flag's own band is, in pixels: the whole canvas unless a front layer is hanging
    // below it, in which case the flag keeps only its share and the cloth gets the rest.
    const bandHeight = () => Math.max(1, Math.round(
        (layered ? bandFraction : 1) * stage.clientHeight));
    function fitFront() {
        const w = stage.clientWidth, h = stage.clientHeight;
        const perUnit = (frontSpan * w) / Math.max(clothW, 1e-3);    // pixels per scene unit
        frontCamera.left = -w / 2 / perUnit;
        frontCamera.right = w / 2 / perUnit;
        // World y = 0 IS the boundary: the bottom of the flag's band, the bottom of the hero.
        frontCamera.top = bandHeight() / perUnit;
        frontCamera.bottom = -(h - bandHeight()) / perUnit;
        frontCamera.updateProjectionMatrix();
    }

    /* ── The cloth: subdivided plane + alpha silhouette of the real outline ── */
    const alpha = document.createElement('canvas');
    alpha.width = 2048;
    alpha.height = Math.min(8192, Math.round(2048 * clothH / clothW));
    const ctx = alpha.getContext('2d');
    // Canvas y grows down, scene y grows up — the ONE flip in this file, into texture space.
    const toAlpha = ([x, y]) => [(x - box.x0) / clothW * alpha.width,
                                 (box.y1 - y) / clothH * alpha.height];

    /* Painted from whatever rings the cloth currently IS, rather than once at build time: the cut
       repaints this every frame, and a silhouette drawn once could only ever show one shape. */
    const alphaMap = new THREE.CanvasTexture(alpha);
    /* `strips` are the tunnels to cut out of the flat cloth, defaulting to this template's own. A
       rolling cut hands its own: the sheet it starts from is a Regular, whose strips are sewn round
       a rigid frame, and once that frame is unhooked they are flat cloth again. */
    function paintSilhouette(rings, strips = tunnel) {
        fillSilhouette(ctx, rings, box, alpha);
        if (strips) {
            // The tunnel strips leave the flat cloth: they wrap the frame as sleeves, built below.
            ctx.fillStyle = '#000';
            if (strips.w) ctx.fillRect(0, 0, strips.w / clothW * alpha.width, alpha.height);
            ctx.fillRect(0, 0, alpha.width, strips.h / clothH * alpha.height);
        }
        alphaMap.needsUpdate = true;
    }
    paintSilhouette([stages ? stages[0] : fabric]);

    /* The reinforcing seam (shop rule, 2026-08-27): 30 mm along the FREE edges is folded in half
       and sewn to a 15 mm double-fabric hem. Double fabric reads as a slightly darker, denser
       band, so the seam is an ambient-occlusion stroke along the non-sleeve boundary — the
       complement of the Pareto frontier the mast follows. A stroke centred on the cut edge is
       30 mm wide, so exactly the inner 15 mm survives the alpha cut: the seam's true width. */
    const hem = document.createElement('canvas');
    hem.width = alpha.width;
    hem.height = alpha.height;
    const hemCtx = hem.getContext('2d');
    hemCtx.fillStyle = '#fff';
    hemCtx.fillRect(0, 0, hem.width, hem.height);
    const sleevePoint = fabric.map(([x, y]) =>
        construction === 'top'
            // Hung flag: only the top edge is the sleeve — the hem runs left, right and bottom.
            ? y > box.y1 - 1e-4
            : !fabric.some(([ox, oy]) => ox < x - SLEEVE_EDGE_TOLERANCE && oy > y + 1e-6));
    hemCtx.strokeStyle = '#b6b6b6';
    hemCtx.lineWidth = 30 * S / clothW * hem.width;
    hemCtx.lineCap = 'round';
    hemCtx.beginPath();
    for (let i = 0; i < fabric.length - 1; i++) {
        // Only a segment lying FULLY on the sleeve edge is the sleeve — 'either endpoint'
        // skipped both vertical hems of a 4-corner rectangle, because each touches a top corner
        // (the hem physically runs right up to the sleeve seam anyway).
        if (sleevePoint[i] && sleevePoint[i + 1]) continue;
        const [ax, ay] = fabric[i], [bx, by] = fabric[i + 1];
        hemCtx.moveTo((ax - box.x0) / clothW * hem.width, (box.y1 - ay) / clothH * hem.height);
        hemCtx.lineTo((bx - box.x0) / clothW * hem.width, (box.y1 - by) / clothH * hem.height);
    }
    hemCtx.stroke();
    const hemMap = new THREE.CanvasTexture(hem);

    const SEG_ACROSS = HERO ? 16 : 48;
    const SEG_X = SEG_ACROSS,
          SEG_Y = Math.min(HERO ? 54 : 160, Math.round(SEG_ACROSS * clothH / clothW));
    const geometry = new THREE.PlaneGeometry(clothW, clothH, SEG_X, SEG_Y);
    geometry.translate(box.x0 + clothW / 2, box.y0 + clothH / 2, 0);
    // aoMap reads the second UV channel; the plane only ships the first, and they are the same.
    geometry.setAttribute('uv1', geometry.attributes.uv);
    /* ── The fabric, close up ──
       Vento flags are 117 g flag polyester. Three things make that read as CLOTH instead of a
       textured plane, and none needs an asset file (the LAN has no internet):
       - a procedural WEAVE bump: threads drawn once on a tiny canvas, repeated at the real pitch
         (~0.4 mm a thread), so zooming in meets fibres instead of blur;
       - SHEEN (MeshPhysicalMaterial): polyester's soft grazing-angle glow, which flat roughness
         cannot fake;
       - the show-through: the BACK renders the mirrored front DIMMED, like light through thin
         fabric — that is what „przebicie lustrzane" looks like, and it is now shown, not merely
         named in the corner note. */
    /* Two octaves, because the two matter at different distances: the thread grid carries the
       extreme close-up, and the SLUBS — irregular streaks a few millimetres wide — are what reads
       as fabric from half a metre, where a 0.4 mm thread is under a pixel and mip-averages away.
