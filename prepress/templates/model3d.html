       A deterministic LCG instead of Math.random, so the cloth looks the same on every visit. */
    const weave = document.createElement('canvas');
    weave.width = weave.height = 256;
    const wctx = weave.getContext('2d');
    wctx.fillStyle = '#8c8c8c';
    wctx.fillRect(0, 0, 256, 256);
    /* Warp-knit 2-bar (Ikonos ST-110 datasheet), not a square weave: the visible structure is
       VERTICAL wales with much fainter horizontal courses — a knit reads as fine striping. */
    for (let i = 0; i < 256; i += 4) {
        wctx.fillStyle = (i / 4) % 2 ? '#5c5c5c' : '#b2b2b2';
        wctx.fillRect(i, 0, 2, 256);
    }
    for (let i = 0; i < 256; i += 4) {
        wctx.fillStyle = (i / 4) % 2 ? 'rgba(160,160,160,0.35)' : 'rgba(110,110,110,0.35)';
        wctx.fillRect(0, i, 256, 1);
    }
    let seed = 1275;
    const rand = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
    for (let i = 0; i < 90; i++) {
        const along = rand() > 0.5;
        const grey = 120 + Math.floor(rand() * 40);
        wctx.fillStyle = `rgba(${grey},${grey},${grey},0.34)`;
        const at = rand() * 256, size = 8 + rand() * 40;
        wctx.fillRect(along ? 0 : at, along ? at : 0,
                      along ? 256 : 2 + rand() * 3, along ? 2 + rand() * 3 : 256);
        void size;
    }
    const weaveMap = new THREE.CanvasTexture(weave);
    weaveMap.wrapS = weaveMap.wrapT = THREE.RepeatWrapping;
    // 256 px of canvas = 64 threads; at 0.4 mm a thread one tile spans 25.6 mm of cloth, which is
    // 0.256 SCENE units at 1:100 (an earlier version dropped a zero and the threads averaged into
    // invisibility at a tenth of a pixel each).
    weaveMap.repeat.set(clothW / 0.256, clothH / 0.256);
    weaveMap.anisotropy = renderer.capabilities.getMaxAnisotropy();

    /* The hero runs on whatever the customer has, and the office PC is an Intel HD 530: the
       full fabric shader gave it 9 fps over a 1265x400 canvas. Sheen roughly doubles the lighting
       cost, and the weave's bump and roughness maps buy nothing at hero size, where a thread is
       far under a pixel. The close-up page keeps all of it — that is where the fabric is the
       subject (measured 2026-08-31). */
    const clothMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xf4f4f6, roughness: 0.72, metalness: 0.0,
        sheen: 0.5, sheenRoughness: 0.55, sheenColor: new THREE.Color(0xffffff),
        bumpMap: weaveMap, bumpScale: 5.0,
        // The same canvas modulates roughness: slubs catch the sheen differently, which is most of
        // what the eye calls "cloth" at arm's length.
        roughnessMap: weaveMap,
        alphaMap, transparent: true, alphaTest: 0.5,
        // The reinforcing hem: double fabric along the free edges, as painted occlusion.
        aoMap: hemMap, aoMapIntensity: 0.85,
        side: THREE.DoubleSide,
    });
    if (data.sides !== 2) {
        // The mirrored show-through: the back face is the front's image seen THROUGH the fabric,
        // so it comes out dimmer and slightly flattened. gl_FrontFacing is the cheapest honest way
        // to say that — one material, no second mesh to drift.
        clothMaterial.onBeforeCompile = (shader) => {
            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <dithering_fragment>',
                `#include <dithering_fragment>
                 // 0.88, not darker: the ST-110 datasheet sells the "excellent double
                 // penetration effect" — dye-sub soaks the knit through, so the back is nearly
                 // as saturated as the front. The mirror is the tell, not heavy dimming.
                 if (!gl_FrontFacing) { gl_FragColor.rgb = mix(vec3(dot(gl_FragColor.rgb,
                     vec3(0.299, 0.587, 0.114))), gl_FragColor.rgb, 0.88) * 0.88; }`);
        };
    }
    const cloth = new THREE.Mesh(geometry, clothMaterial);
    scene.add(cloth);

    /* The artwork, when the shop configured a demo one (or, later, when the customer uploaded).
       The page it was laid out on IS this template's page, so the plane's own UVs place it — the
       fabric box is a sub-rectangle of that page, so the UVs are offset and scaled to match, and
       nothing is stretched. A missing texture leaves bare cloth; it is decoration, not a verdict. */
    /* The customer's artwork OUTRANKS the demo. Both load asynchronously, so without a rank the
       slower one wins the material — and the demo, fetched over HTTP, reliably finishes AFTER the
       postMessage's data URI, dressing the customer's flag in somebody else's job. */
    /* The tunnel sleeves (rigid frames only), filled in by the mast block; each knows which
       strip of the PAGE wraps around it, in scene units — wearArtwork divides by the page. */
    const tunnelSleeves = [];
    let artworkRank = 0;
    function wearArtwork(url, rank = 0) {
        if (!data.page_mm || rank < artworkRank) return;
        artworkRank = rank;
        const [pageW, pageH] = data.page_mm.map(v => v * S);
        new THREE.TextureLoader().load(url, texture => {
            if (rank < artworkRank) return;         // something more authoritative landed meanwhile
            texture.colorSpace = THREE.SRGBColorSpace;
            // Anisotropy is what keeps the print readable at an angle — without it the mipmap
            // picked for an oblique surface is the blurry one, whatever the texture's resolution.
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            // The plane spans the FABRIC box; the artwork spans the PAGE. Map one onto the other.
            texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping;
            texture.repeat.set(clothW / pageW, clothH / pageH);
            texture.offset.set(box.x0 / pageW, box.y0 / pageH);
            clothMaterial.map = texture;
            clothMaterial.color.set(0xffffff);      // stop tinting the artwork with the cloth grey
            clothMaterial.needsUpdate = true;
            // The sleeves wear THEIR strip of the same page, wrapped around the
            // circumference. A page-mapped sleeve (the winder's) carries page fractions in its
            // own UVs, so its texture stays untransformed.
            for (const sleeve of tunnelSleeves) {
                const wrap = texture.clone();
                if (sleeve.page) {
                    wrap.wrapS = wrap.wrapT = THREE.ClampToEdgeWrapping;
                    wrap.repeat.set(1, 1);
                    wrap.offset.set(0, 0);
                } else {
                    wrap.wrapS = wrap.wrapT = THREE.RepeatWrapping;
                    wrap.repeat.set(sleeve.w / pageW, sleeve.h / pageH);
                    wrap.offset.set(sleeve.x / pageW, sleeve.y / pageH);
                }
                wrap.needsUpdate = true;
                sleeve.mesh.material.map = wrap;
                sleeve.mesh.material.color.set(0xffffff);
                sleeve.mesh.material.needsUpdate = true;
            }
        }, undefined, () => { /* no artwork — bare cloth is the correct fallback */ });
    }
    // THIS template's demo — laid out inside its own safe outline (demo_artwork.py).
    wearArtwork(`{{ base }}/api/demo-artwork.jpg?token=${encodeURIComponent(token)}`, 0);

    /* The check page hands over the CUSTOMER's raster and the findings' regions. Same origin only:
       the message carries a data URI and rectangles, and nothing else is trusted. Regions join the
       guides list, so they ride the wind like every other line on the cloth. */
    const LEVEL_COLOURS = { red: 0xd21f3c, amber: 0xc77700 };
    window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin || !event.data) return;
        /* Layout, from the page that owns it. Only the parent knows how tall its hero is, and it
           can change on any resize — so this arrives as a message rather than as a URL, because
           re-reading the URL would mean reloading the frame and restarting the roll from the top
           every time somebody dragged a window edge. */
        if (typeof event.data.band === 'number' && event.data.band > 0) {
            bandFraction = Math.min(Math.max(event.data.band, 0.15), 0.98);
            resize();
        }
        if (typeof event.data.span === 'number' && event.data.span > 0) {
            frontSpan = Math.min(Math.max(event.data.span, 0.25), 1.6);
            fitFront();
        }
        if (typeof event.data.artwork === 'string'
                && event.data.artwork.startsWith('data:image/')) {
            wearArtwork(event.data.artwork, 1);
        }
        if (typeof event.data.artworkBack === 'string'
                && event.data.artworkBack.startsWith('data:image/')) {
            /* Two files = a REAL dwustronna: the back is its own print, not show-through. A second
               mesh with a BackSide material replaces the mirror: the texture flips in X so it reads
               correctly when viewed from behind (two prints sewn back to back both read forward),
               and the front material stops rendering the back face at all. */
            clothMaterial.side = THREE.FrontSide;
            clothMaterial.onBeforeCompile = () => {};
            clothMaterial.needsUpdate = true;
            const backMaterial = clothMaterial.clone();
            backMaterial.side = THREE.BackSide;
            backMaterial.onBeforeCompile = () => {};
            new THREE.TextureLoader().load(event.data.artworkBack, (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
                texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping;
                const [pageW, pageH] = data.page_mm.map(v => v * S);
                texture.repeat.set(-clothW / pageW, clothH / pageH);
                texture.offset.set((box.x0 + clothW) / pageW, box.y0 / pageH);
                backMaterial.map = texture;
                backMaterial.color.set(0xffffff);
                backMaterial.needsUpdate = true;
                group.add(new THREE.Mesh(geometry, backMaterial));
            });
            const note = document.getElementById('sideNote');
            if (note) note.textContent = 'Flaga dwustronna — tył ma własną grafikę (nie lustro).';
        }
        for (const region of (event.data.regions || [])) {
            const [x, y, w, h] = (region.rect_mm || []).map(Number);
            if (!(w > 0 && h > 0)) continue;
            // Regions arrive in page mm, top-left frame (the measurement frame); the scene is the
            // PDF frame, y up — one flip, here.
            const pageH_mm = data.page_mm[1];
            const y0 = (pageH_mm - y - h) * S, y1 = (pageH_mm - y) * S;
            const x0 = x * S, x1 = (x + w) * S;
            const base = [new THREE.Vector3(x0, y0, 0), new THREE.Vector3(x1, y0, 0),
                          new THREE.Vector3(x1, y1, 0), new THREE.Vector3(x0, y1, 0),
                          new THREE.Vector3(x0, y0, 0)];
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(base),
                new THREE.LineBasicMaterial({
                    color: LEVEL_COLOURS[region.level] || LEVEL_COLOURS.amber, linewidth: 2 }));
            guides.push({ line, base });
            group.add(line);
        }
        if ((event.data.regions || []).length) calmDown();   // re-stamp z offsets onto new lines
    });

    // Guide lines: separate objects so they stay crisp, but displaced by the SAME wind function
    // each frame — lines floating off waving cloth would claim geometry the fabric does not have.
    const guides = [];
    // Only lines that lie ON the fabric. The hem cut sits ~90 mm outside the corpus, and after the
    // fold it physically becomes the sleeve edge — drawing it flat would float a magenta ring in
    // mid-air beside the flag. The PDF (one click away) still shows every line.
    const onFabric = points => points.every(([x, y]) =>
        x * S >= box.x0 - 0.06 && x * S <= box.x1 + 0.06 &&
        y * S >= box.y0 - 0.06 && y * S <= box.y1 + 0.06);
    for (const [points, colour] of [...data.safe.map(p => [p, 0x2f9e52]),
                                    ...rings.map(r => [r.points, 0xd81a73])].filter(
                                        ([points]) => onFabric(points))) {
        const base = points.map(([x, y]) => new THREE.Vector3(x * S, y * S, 0));
        const line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(base),
            new THREE.LineBasicMaterial({ color: colour }));
        guides.push({ line, base });
        scene.add(line);
    }

    /* The folded hem, as GEOMETRY: the sewn strip folded onto the BACK of the flag — a 15 mm
       ribbon 2 mm behind the cloth along every hem edge (the non-sleeve boundary), wearing the
       artwork like the sleeves do. The earlier paint-only fold (AO + a bump) vanished exactly
       where the real fold lives: on the shadowed back. Each ribbon rides the wind with the cloth
       it is sewn to. */
    const hemFolds = [];
    {
        const FOLD = 15 * S;
        const pageWs2 = data.page_mm[0] * S, pageHs2 = data.page_mm[1] * S;
        const inwardOf = ([ax, ay], [bx, by]) => {
            let nx = -(by - ay), ny = bx - ax;
            const len = Math.hypot(nx, ny) || 1;
            nx /= len; ny /= len;
            const toCentre = ((box.x0 + box.x1) / 2 - (ax + bx) / 2) * nx
                           + ((box.y0 + box.y1) / 2 - (ay + by) / 2) * ny;
            return toCentre >= 0 ? [nx, ny] : [-nx, -ny];
        };
        const buildRibbon = (indices) => {
            const pts = indices.map(i => fabric[i]);
            const positions = [], uvs = [], rest = [], tri = [];
            for (let k = 0; k < pts.length; k++) {
                const [nx, ny] = inwardOf(pts[Math.max(k - 1, 0)],
                                          pts[Math.min(k + 1, pts.length - 1)]);
                const [x, y] = pts[k];
                for (const depth of [0, FOLD]) {
                    const px = x + nx * depth, py = y + ny * depth;
                    positions.push(px, py, 0);
                    uvs.push(px / pageWs2, py / pageHs2);
                    rest.push([px, py]);
                }
            }
            for (let k = 0; k < pts.length - 1; k++) {
                const a = k * 2;
                tri.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geometry.setIndex(tri);
            geometry.computeVertexNormals();
            const mesh = new THREE.Mesh(geometry, new THREE.MeshPhysicalMaterial({
                color: 0xeceff1, roughness: 0.74, metalness: 0.0,
                sheen: 0.5, sheenRoughness: 0.55, sheenColor: new THREE.Color(0xffffff),
                side: THREE.DoubleSide,
            }));
            scene.add(mesh);
            // Dressed by wearArtwork like a page-mapped sleeve: the fold shows the print.
            tunnelSleeves.push({ mesh, page: true });
            hemFolds.push({ positions: geometry.attributes.position, rest,
                            geometry, mesh });
        };
        let run = [];
        for (let i = 0; i < fabric.length - 1; i++) {
            if (sleevePoint[i] && sleevePoint[i + 1]) {
                if (run.length >= 2) buildRibbon(run);
                run = [];
                continue;
            }
            if (!run.length) run.push(i);
            run.push(i + 1);
        }
        if (run.length >= 2) buildRibbon(run);
    }

    /* The mast pieces the wind bends, filled while the mast is built. Declared BEFORE that block:
       a const declared lower in the same scope is a TDZ ReferenceError at the push — the exact
       trap that once killed the whole admin panel. */
    const mastPieces = [];
    const mastCollars = [];
    let mastArcOf = null;

    /* ── The mast: bent through the sleeve, not stuck through it ──
       The real arm is fiberglass and FOLLOWS the sewn tunnel, so its path is the fabric's own
       upper-left boundary — the Pareto frontier of the outline (no other point has both smaller x
       and larger y). That hugs the straight left edge, turns with the shoulder, and ends at the
       curve's tip, for every Play and Drop shape alike, with no per-shape code. Below the fabric
       the pole drops straight to the ground plate (the shop's price list: the flag's top is flush with the mast
       top and the leftover is bare pole).

       Telescoping like the real thing (sklepzreklamami tech sheet, Standard S: 4 elements,
       72 / 72.2 / 70 / 90.5 cm, Ø16.5 mm, aluminium + fiberglass): four sections of one curve with
       stepped radii — the visible joints ARE how the product looks. */
    const mastH = (data.mast_mm || 0) * S;
    const group = new THREE.Group();
    group.add(cloth);
    guides.forEach(g => group.add(g.line));
    hemFolds.forEach(f => group.add(f.mesh));
    /* NO TABLE, and so nothing here but the ground the mast stands on. What the fallen cloth folds
       over is the bottom edge of the frame, and that lives in the front layer, which has its own
       coordinates and needs nothing from this one. */
    // Everything the mast block is about to add belongs to the pole assembly, which a cut removes.
    const beforeMast = group.children.length;
    /* Hoisted out of the mast block: a rolling cut builds a SECOND frame below — the sheet's own —
       and both need the same ground, the same metal and the same size of base plate. */
    const groundY = box.y1 - mastH;
    /* Barely metallic on purpose. A metal in three.js is lit by what it REFLECTS, and this scene
       has no environment map to reflect, so metalness 0.7 rendered the mast as a black spike down
       the flag rather than a pole (shop rule, spotted it on a phone, 2026-08-31). Low metalness
       lets the hemisphere and key light land on it diffusely, which is what brushed aluminium looks
       like anyway. An env map would be the richer fix and costs a cube render the hero cannot
       afford. */
    const steel = new THREE.MeshStandardMaterial({ color: 0xb4b9c1, roughness: 0.42,
                                                   metalness: 0.12 });
    // The base is a SQUARE plate sized per flag size (the price list gives its diagonal).
    const baseSide = ((data.base || {}).side_mm || 300) * S;
    const basePlate = () => new THREE.Mesh(new THREE.BoxGeometry(baseSide, 30 * S, baseSide),
        new THREE.MeshStandardMaterial({ color: 0x2c2f36, roughness: 0.8 }));
    if (mastH > 0) {
        const frontier = fabric
            .filter(([x, y]) => !fabric.some(([ox, oy]) => ox < x - SLEEVE_EDGE_TOLERANCE && oy > y + 1e-6))
            .sort((a, b) => a[1] - b[1]);
        const plate = new THREE.Mesh(new THREE.BoxGeometry(baseSide, 30 * S, baseSide),
            new THREE.MeshStandardMaterial({ color: 0x2c2f36, roughness: 0.8 }));
        plate.position.set(frontier[0][0], groundY + 15 * S, 0);
        group.add(plate);


        if (construction === 'top') {
            /* The hung flag: a vertical mast beside the left edge, a rigid crossarm through the
               top tunnel, cloth hanging free below it. The mast height is ILLUSTRATIVE (a real
               stadium mast is many times the flag) — the point is the fold and the hang, so the
               note says none of the Vento the shop's price list numbers. Nothing joins mastPieces: the frame is
               rigid, and the wind model reads construction directly. */
            // Folded in half, like every tunnel here: the strip becomes a loop of HALF its
            // width, and its seam lands exactly on the flat cloth's top edge — the gap in the
            // owner's screenshot was a full-width sleeve floating above a fully clipped strip.
            const fold = tunnel.h / 2;
            const poleX = box.x0 - 60 * S;
            const poleR = 20 * S, armR = 15 * S;
            const tail = Math.max(fold - armR, 25 * S);
            const armY = (box.y1 - tunnel.h) + tail;
            const topGroundY = box.y0 - 500 * S;
            plate.position.set(poleX, topGroundY + 15 * S, 0);
            const pole = new THREE.Mesh(
                new THREE.CylinderGeometry(poleR, poleR, (box.y1 + 150 * S) - topGroundY, 16),
                steel);
            pole.position.set(poleX, (topGroundY + box.y1 + 150 * S) / 2, 0);
            group.add(pole);
            const cap = new THREE.Mesh(new THREE.SphereGeometry(poleR * 1.3, 14, 12), steel);
            cap.position.set(poleX, box.y1 + 150 * S, 0);
            group.add(cap);
            const arm = new THREE.Mesh(
                new THREE.CylinderGeometry(armR, armR, box.x1 - poleX + 30 * S, 12),
                new THREE.MeshStandardMaterial({ color: 0xe8e8ea, roughness: 0.4 }));
            arm.rotation.z = Math.PI / 2;
            arm.position.set((poleX + box.x1 + 30 * S) / 2, armY, 0);
            group.add(arm);

            // The top tunnel as the sleeve: slack fabric hanging off the arm, the flag's weight
            // pulling it down — seam at the bottom of the strip, where it meets the flat cloth.
            const sleeveCloth = new THREE.MeshPhysicalMaterial({
                color: 0xf4f4f6, roughness: 0.72, metalness: 0.0,
                sheen: 0.5, sheenRoughness: 0.55, sheenColor: new THREE.Color(0xffffff),
                side: THREE.DoubleSide,
            });
            const sweep = sweepSleeve(
                new THREE.LineCurve3(new THREE.Vector3(box.x0, armY, 0),
                                     new THREE.Vector3(box.x1, armY, 0)),
                { radiusAt: () => armR + 3 * S,
                  tailAt: () => tail,
                  tailDirAt: () => new THREE.Vector3(0, -1, 0),
                  uvAt: (t, fraction) => [t, fraction] });
            const topSleeve = new THREE.Mesh(sweep.geometry, sleeveCloth);
            group.add(topSleeve);
            tunnelSleeves.push({ mesh: topSleeve,
                                 w: clothW, h: tunnel.h, x: box.x0, y: box.y1 - tunnel.h });

            document.getElementById('mastNote').textContent =
                'maszt poglądowy — flaga wieszana za tunel górny (poprzeczka w tunelu)';
        } else if (data.rigid) {
            const frame = rigidFrame({ tunnel, box, groundY, S });
            plate.position.x = frame.poleX;
            group.add(frame.parts);
            tunnelSleeves.push(...frame.sleeves);

            document.getElementById('mastNote').textContent =
                `maszt Vento Regular: ${Math.round(data.mast_mm / 10)} cm, sztywny (alu + ramię)`
                + (data.base ? ` · podstawa ${(data.base.side_mm / 10).toFixed(1)} cm, `
                             + `${data.base.weight_kg} kg` : '');
        } else {
            // INSIDE the hem: the sleeve wraps the tube, so the path shifts off the edge into the
            // fabric by most of the tube's radius. The tube bulging through the flat cloth on
            // both sides is not a glitch — that is what a sewn sleeve looks like from outside.
            const centre2d = [(box.x0 + box.x1) / 2, (box.y0 + box.y1) / 2];
            const tucked = frontier.map(([x, y]) => {
                const dx = centre2d[0] - x, dy = centre2d[1] - y;
                const len = Math.hypot(dx, dy) || 1;
                return [x + dx / len * 6 * S, y + dy / len * 6 * S];
            });
            const path = [new THREE.Vector3(tucked[0][0], groundY, 0),
                          ...tucked.map(([x, y]) => new THREE.Vector3(x, y, 0))];
            const curve = new THREE.CatmullRomCurve3(path, false, 'centripetal', 0.2);

            // Section shares of the real mast, base to tip; radii step down from Ø16.5 mm.
            // In millimetres THROUGH S like every other dimension — the first version wrote them
            // mm*0.001 in an mm*0.01 scene and the pole rendered ten times too thin.
            const SECTIONS = [[0.00, 0.245, 8.25], [0.245, 0.49, 7.2],
                              [0.49, 0.73, 6.2], [0.73, 1.0, 5.0]];
            for (const [from, to, radiusMm] of SECTIONS) {
                const radius = radiusMm * S;
                const piece = new THREE.TubeGeometry(
                    new SubCurve(curve, from, to), 36, radius, 12, false);
                group.add(new THREE.Mesh(piece, steel));
                // The wind bends this piece: every ring of the tube knows its arc position, so
                // the sway that moves the cloth's sleeve moves the SAME arc of the tube — a pole
                // standing still under waving cloth was the exact complaint.
                const rings = 36 + 1, radial = 12 + 1;
                const sPerVertex = new Float32Array(piece.attributes.position.count);
                for (let v = 0; v < sPerVertex.length; v++) {
                    sPerVertex[v] = from + (Math.floor(v / radial) / (rings - 1)) * (to - from);
                }
                mastPieces.push({ positions: piece.attributes.position,
                                  rest: piece.attributes.position.array.slice(),
                                  s: sPerVertex, geometry: piece });
                if (from > 0) {
                    // The joint collar: the fatter section's mouth the next one telescopes in.
                    const at = curve.getPointAt(from);
                    const collar = new THREE.Mesh(
                        new THREE.SphereGeometry(radius * 1.5, 12, 10), steel);
                    collar.position.copy(at);
                    collar.scale.y = 1.6;
                    group.add(collar);
                    mastCollars.push({ mesh: collar, s: from });
                }
            }
            /* Where the FABRIC hangs on that arc — by ARC LENGTH, the same measure the tube's own
               s uses (SubCurve samples getPointAt), so the sleeve and the tube inside it get the
               SAME sway and move as one thing; "connected" was the exact word. Low points
               hang off the vertical run at their own height; points near the top hang off the arm
               above them, so their attachment slides outward with x — blended by the square of
               the height fraction, because the arm only matters near the top. */
            const cum = [0];
            for (let i = 1; i < path.length; i++) {
                cum.push(cum[i - 1] + path[i].distanceTo(path[i - 1]));
            }
            const total = cum[cum.length - 1] || 1;
            const arcWhere = (value, axis) => {
                for (let i = 1; i < path.length; i++) {
                    if (path[i][axis] >= value) {
                        const lo = path[i - 1][axis], hi = path[i][axis];
                        const f = hi > lo ? (value - lo) / (hi - lo) : 1;
                        return cum[i - 1] + f * (cum[i] - cum[i - 1]);
                    }
                }
                return total;
            };
            mastArcOf = (x, y) => {
                const w = Math.pow(Math.min(Math.max((y - box.y0) / clothH, 0), 1), 2);
                return Math.min(1,
                    ((1 - w) * arcWhere(y, 'y') + w * arcWhere(x, 'x')) / total);
            };

            /* The winder's sleeve: the folded tunnel strip as a fabric pancake around the mast,
               from where the fabric starts to the tip — the pole is INSIDE it, and only the bare
               run below the flag shows metal. The seam points into the cloth (the tuck
               direction); the profile follows the mast's taper. Going around the sleeve maps the
               artwork by real distance outward into the page's hem strip: that is what sewing
               the printed strip into a loop does, so the awers graphic wraps and meets the
               mirrored rewers, exactly as sewn. */
            const sleeveFrom = cum[1] / total;
            const radiusOn = (s) => (SECTIONS.find(([f, to]) => s <= to) || SECTIONS[3])[2] * S;
            const pageWs = data.page_mm[0] * S, pageHs = data.page_mm[1] * S;
            const mastSleeveCurve = new SubCurve(curve, sleeveFrom, 1);
            const inwardAt = (pos) => new THREE.Vector3(
                centre2d[0] - pos.x, centre2d[1] - pos.y, 0).normalize();
            const sweep = sweepSleeve(mastSleeveCurve, {
                rings: 44,
                radiusAt: (t) => radiusOn(sleeveFrom + t * (1 - sleeveFrom)) + 3 * S,
                // The folded strip hugs the mast: both strip edges are sewn into the corpus cut
                // edge with a ~15 mm seam, so the sleeve reaches just past that seam and NEVER
                // onto the safe area — the first version's 42 mm tail sat on top of the print
                // (owner's correction). Path is tucked 6 mm in; 6 + ~15 = the seam line.
                tailAt: () => 20 * S,
                tailDirAt: (t, pos) => inwardAt(pos),
                uvAt: (t, fraction, pos, aroundDist) => {
                    const out = inwardAt(pos).multiplyScalar(-1);
                    return [(pos.x + out.x * aroundDist) / pageWs,
                            (pos.y + out.y * aroundDist) / pageHs];
                },
            });
            const mastSleeve = new THREE.Mesh(sweep.geometry, new THREE.MeshPhysicalMaterial({
                color: 0xf4f4f6, roughness: 0.72, metalness: 0.0,
                sheen: 0.5, sheenRoughness: 0.55, sheenColor: new THREE.Color(0xffffff),
                side: THREE.DoubleSide,
            }));
            group.add(mastSleeve);
            // Dressed with the page itself (uv already IS the page fraction), and bent by the
            // wind with the tube inside it — same arc measure, same sway.
            tunnelSleeves.push({ mesh: mastSleeve, page: true });
            const sleeveS = new Float32Array(sweep.ringOfVertex.length);
            for (let v = 0; v < sleeveS.length; v++) {
                sleeveS[v] = sleeveFrom + (sweep.ringOfVertex[v] / 44) * (1 - sleeveFrom);
            }
            mastPieces.push({ positions: sweep.geometry.attributes.position,
                              rest: sweep.geometry.attributes.position.array.slice(),
                              s: sleeveS, geometry: sweep.geometry });
            document.getElementById('mastNote').textContent =
                `maszt Vento Standard: ${Math.round(data.mast_mm / 10)} cm, 4-częściowy, Ø16,5 mm`
                + (data.base ? ` · podstawa ${(data.base.side_mm / 10).toFixed(1)} cm, `
                             + `${data.base.weight_kg} kg` : '');
        }
    }

    /* ── Two groups the roll moves as wholes ──
       `rig` is the pole assembly: mast, base plate and the sewn sleeves that wrap it. A cut takes
       the flag OFF its pole — the owner's script says remove flagpole, cut, insert flagpole, which
       is also what a cutter does with one — so the whole assembly slides out and back as one thing.
       `flag` is the job: the cloth, the lines drawn on it, its sewn hem and the rig it hangs from,
       so a finished flag can slide out of the frame and a fresh sheet slide in behind it. The
       bench, the waste heaped on it and the mark that clears it stay put — they are the table, not
       the job. Re-parented rather than built as a hierarchy up front: both groups sit at the
       origin, so every world position is untouched and the mast code above stays exactly as it was.
       (`add` re-parents on its own; removing first would be a second, redundant traversal.) */
    const rig = new THREE.Group();
    // Everything the mast block added, and that is all of it: with the bench gone there is nothing
    // in that range which is not part of the pole assembly.
    for (const child of group.children.slice(beforeMast)) rig.add(child);

    /* ── The SHEET's own frame ──
       A roll starts on a Regular, and a Regular does not hang on the Vento winder mast this page's
       template uses: it is different hardware entirely — rigid pole, rigid arm, elbow, and its
       tunnels sewn round them as full sleeves (the shop, 2026-09-01). So the sheet gets its own
       frame, and the roll swaps ONCE and only once: the Regular comes off, the cut runs, and the
       Vento mast goes in behind the Play that came out of it. The two cuts after that leave the
       mast standing — no more taking flags on and off poles. */
    let sheetRig = null, sheetTunnel = null;
    if (stages && mastH > 0 && (cutFrom[0] || {}).rigid) {
        sheetTunnel = tunnelsOf(stages[0], box, clothW, S);
        const frame = rigidFrame({ tunnel: sheetTunnel, box, groundY, S });
        const sheetPlate = basePlate();
        sheetPlate.position.set(frame.poleX, groundY + 15 * S, 0);
        frame.parts.add(sheetPlate);
        sheetRig = frame.parts;
        tunnelSleeves.push(...frame.sleeves);
        /* Repaint now that the sheet's strips are known: the first paint further up drew the sheet
           as whole flat cloth, and with the sleeves standing on top of it that reads as two
           thicknesses of fabric along the pole and the arm. */
        paintSilhouette([stages[0]], sheetTunnel);
    }

    const flag = new THREE.Group();
    flag.add(cloth, ...guides.map(g => g.line), ...hemFolds.map(f => f.mesh), rig);
    if (sheetRig) flag.add(sheetRig);
    group.add(flag);
    /* Far enough down to leave the frame entirely — and the frame reaches below the bench, where
       the waste hangs, so clearing the mast's own height is not enough: at mastH + 4 the curved
       tip sat in shot at the bottom for the whole of every cut. */
    const poleTravel = mastH + 8;

    scene.add(group);

    /* Hemisphere instead of flat ambient — sky above, ground bounce below — plus a rim from
       behind-left. Flat ambient was why the tube and the cloth read as depthless: every normal got
       the same light. */
    scene.add(new THREE.HemisphereLight(0xf4f6ff, 0x3a3c40, 0.95));
    const sun = new THREE.DirectionalLight(0xffffff, 1.7);
    sun.position.set(2, 3, 4);
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0xdfe8ff, 0.5);
    rim.position.set(-3, 1.5, -3);
    scene.add(rim);

    /* The FLAG's own bounds, and nothing else's. The cloth that comes off it is framed by the front
       layer's own camera, so the back layer no longer reserves room below the product for it —
       reserving that room was what shrank the flag. */
    const bounds = new THREE.Box3().setFromObject(group);
    const size = bounds.getSize(new THREE.Vector3());
    const centre = bounds.getCenter(new THREE.Vector3());
    controls.target.copy(centre);
    function fitCamera() {
        const aspect = Math.max(stage.clientWidth / bandHeight(), 0.2);
        const half = Math.max(size.y, size.x / aspect) / 2;
        const distance = half / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.2;
        camera.position.set(centre.x + distance * 0.25, centre.y + distance * 0.06,
                            centre.z + distance);
        camera.lookAt(centre);
    }

    document.getElementById('sideNote').textContent = data.sides === 2
        ? 'Flaga dwustronna — tył ma własną grafikę (nie lustro).'
        : 'Flaga jednostronna — tył to lustrzane przebicie przodu.';

    /* ── Wind ──
       The cloth hangs from the mast side and the top arm, so displacement grows with distance from
       BOTH anchors: waves travel outward and downward, and the free bottom-outer corner moves the
       most — which is what a winder does. Amplitude and wavelength are proportioned to the flag,
       not absolute, so an XL billows like an XL. */
    const windBox = document.getElementById('wind');
    /* The hero: wind on, slowly turning, no controls. Respects prefers-reduced-motion — a flag
       spinning behind text is exactly what that setting exists to stop. */
    const bare = document.body.classList.contains('bare');
    const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (bare) {
        windBox.checked = !calm;
        controls.enabled = false;
        camera.position.x = centre.x + (camera.position.z - centre.z) * 0.35;
        camera.lookAt(centre);
    }

    /* ── The hero tour ──
       A hero that only turns on the spot shows the flag's silhouette and nothing else. What is
       worth looking at is the CORPUS: the printed cloth, its weave, the sleeve seam. So the camera
       walks a loop — establish the whole product, come in close across the fabric, pull back out —
       and the flag keeps turning underneath it.

       `aim` is a fraction of the product's height (0 at the plate, 1 at the mast tip), `dist` a
       multiple of the framing distance fitCamera worked out, `yaw` degrees around the flag. Keys
       are held in one table because the timing is the design; scattering it through the loop is
       how a tour becomes impossible to retune. */
    const TOUR = [
        { at: 0.00, dist: 1.00, yaw: -20, aim: 0.50 },   // the whole product, slightly off-axis
        { at: 0.18, dist: 0.94, yaw:  16, aim: 0.52 },   // turning, still full height
        { at: 0.36, dist: 0.34, yaw:  12, aim: 0.74 },   // in on the upper corpus
        { at: 0.54, dist: 0.28, yaw:  -6, aim: 0.52 },   // down the printed face
        { at: 0.70, dist: 0.32, yaw: -26, aim: 0.36 },   // past the sleeve, near the foot
        { at: 0.86, dist: 0.70, yaw: -30, aim: 0.48 },   // easing back out
        { at: 1.00, dist: 1.00, yaw: -20, aim: 0.50 },   // home, so the loop does not jump
    ];
    const TOUR_SECONDS = 17;

    function smooth(t) { return t * t * (3 - 2 * t); }

    function tourAt(seconds) {
        const t = (seconds % TOUR_SECONDS) / TOUR_SECONDS;
        let i = 0;
        while (i < TOUR.length - 2 && TOUR[i + 1].at <= t) i++;
        const a = TOUR[i], b = TOUR[i + 1];
        const span = Math.max(b.at - a.at, 1e-6);
        const k = smooth(Math.min(Math.max((t - a.at) / span, 0), 1));
        return { dist: a.dist + (b.dist - a.dist) * k,
                 yaw: a.yaw + (b.yaw - a.yaw) * k,
                 aim: a.aim + (b.aim - a.aim) * k };
    }

    /* The distance that framed the whole product; every tour step is a multiple of it, so the
       choreography holds whatever size flag this template is. */
    function framingDistance() {
        const aspect = Math.max(stage.clientWidth / bandHeight(), 0.2);
        const half = Math.max(size.y, size.x / aspect) / 2;
        return half / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.2;
    }

    /* How close the tour may come, given the shape of the window it is playing in. A close-up that
       frames a hand's width of fabric is a nice detail on a wide strip and a wall of blue on a
       phone, where the same distance shows a fraction of the flag (shop rule, 2026-08-31). The
       floor rises as the stage narrows. */
    function closestAllowed() {
        const width = stage.clientWidth || 1;
        if (width < 420) return 0.78;
        if (width < 620) return 0.62;
        if (width < 900) return 0.44;
        return 0.28;
    }

    /* One step of any choreography, put on the camera. Shared by the hero tour and by the roll,
       because "where the camera goes for a { dist, yaw, aim }" is one piece of knowledge and two
       copies of it drift. */
    function placeCamera(step) {
        const target = new THREE.Vector3(centre.x, centre.y + (step.aim - 0.5) * size.y, centre.z);
        const radians = THREE.MathUtils.degToRad(step.yaw);
        const away = framingDistance() * Math.max(step.dist, closestAllowed());
        camera.position.set(target.x + Math.sin(radians) * away,
                            // Rising slightly as the camera pulls back, so a wide shot looks down
                            // the flag instead of up at it.
                            target.y + away * 0.06,
                            target.z + Math.cos(radians) * away);
        camera.lookAt(target);
    }

    function driveTour(seconds) {
        placeCamera(tourAt(seconds));
    }

    /* ── The camera through a roll ──
       Each flag takes its turn in front of the lens: in, around and out again — the owner's
       "zoom, swirl, zoomout" as ONE continuous move rather than three cuts. Everything else holds
       this same wide shot, because the cut, the drop and the sweep all have to be seen whole: a
       close-up mid-stroke hides the one thing worth watching, and the waste lands at the very
       bottom of the frame.

       Both ends of the turn land exactly on the wide shot — the swirl is a full sine, so it comes
       back through centre — which is what keeps the join between a flag's turn and the cut that
       follows it from being a jump. */
    const ROLL_WIDE = { dist: 1.0, yaw: -8, aim: 0.5 };
    const ROLL_SWIRL = 34;                    // degrees the turn swings either side of the wide shot
    /* How much of the framing distance the zoom eats. The wide shot frames the whole product —
       flag AND mast, about 30 units — so a modest number is already a real close-up on the cloth:
       0.34 brings 30 units of frame down to 24, which is the flag and nothing else. It was 0.62
       first and the flag went out of frame top and bottom at the deepest point, which is a
       close-up of nothing in particular; 0.42 still clipped the tip once the aim had risen. */
    const ROLL_CLOSE = 0.34;
    const ROLL_RISE = 0.10;                   // how far the aim walks up the corpus and back
    function driveRoll(beat) {
        if (beat.kind !== 'present') { placeCamera(ROLL_WIDE); return; }
        placeCamera({
            dist: ROLL_WIDE.dist - ROLL_CLOSE * Math.sin(Math.PI * beat.k),
            yaw: ROLL_WIDE.yaw + ROLL_SWIRL * Math.sin(2 * Math.PI * beat.k),
            aim: ROLL_WIDE.aim + ROLL_RISE * Math.sin(Math.PI * beat.k),
        });
    }
    /* How far the guide lines float above the cloth. It has to clear the reinforcing hem, which
       stands 2 mm proud: at the old 0.4 mm the red cut line was sunk INSIDE the fabric along every
       hem edge and surfaced through it in patches, which is the "clipping" a hero close-up made
       obvious (shop rule, 2026-08-31). 2.4 mm on a three-metre flag is invisible from any distance
       that is not a close-up, and at a close-up it reads as a line lying ON the cloth. */
    const GUIDE_LIFT = 2.4 * S;
    const positions = geometry.attributes.position;
    const restXY = [];
    for (let i = 0; i < positions.count; i++) {
        restXY.push([positions.getX(i), positions.getY(i)]);
    }
    /* The reinforcing hem is sewn DOUBLE — a flat pancake of fabric, not paint. Every cloth
       vertex inside the hem band (read off the same canvas the AO uses) sits 2 mm proud, so the
       seam catches light as a real ridge on top of the darker AO. */
    const hemPixels = hemCtx.getImageData(0, 0, hem.width, hem.height).data;
    const hemRidge = new Float32Array(positions.count);
    for (let i = 0; i < positions.count; i++) {
        const [x, y] = restXY[i];
        const u = Math.min(hem.width - 1, Math.max(0,
            Math.round((x - box.x0) / clothW * hem.width)));
        const v = Math.min(hem.height - 1, Math.max(0,
            Math.round((box.y1 - y) / clothH * hem.height)));
        hemRidge[i] = hemPixels[(v * hem.width + u) * 4] < 250 ? 2 * S : 0;
    }
    const AMPLITUDE = clothW * 0.10;
    const WAVE_K = 2 * Math.PI / (clothH * 0.8);
    // The cantilever: sway grows with the SQUARE of the arc position (a tapering tube bends ever
    // more the further from the base) and the tip gets a faster second harmonic — the whip.
    const SWAY = clothH * 0.045;

    function poleSway(s, t) {
        return SWAY * s * s * (Math.sin(t * 1.15) * 0.8 + Math.sin(t * 2.55 + 1.2) * 0.2 * s);
    }

    function waveOnly(x, y, t) {
        /* The cloth's OWN wave grows with distance from its attachment — the sleeve along the left
           edge and the arm along the top. The envelope reaches EXACTLY zero at the attachment: the
           sleeve is sewn around the tube, so at that line the cloth's motion IS the tube's motion
           (poleSway) and nothing else — an extra residual wave there is the disconnect the shop
           saw. On a RIGID Regular frame there is no sway at all and the cloth breathes only near
           the free bottom-right corner, furthest from both rigid members. */
        const fromMast = Math.min(Math.max((x - box.x0) / clothW, 0), 1);
        const fromArm = Math.min(Math.max((box.y1 - y) / clothH, 0), 1);
        if (construction === 'top') {
            /* Hung by the top edge only: the cloth is anchored along the arm and FREE everywhere
               else, so the wave grows straight down — the bottom edge moves most. */
            return AMPLITUDE * Math.pow(fromArm, 1.25)
                * Math.sin(WAVE_K * (x * 0.9 + y) - t * 2.6)
                * (0.75 + 0.25 * Math.sin(t * 0.7 + y * 0.5));
        }
        if (data.rigid) {
            return AMPLITUDE * 0.6 * Math.pow(fromMast * fromArm, 1.9)
                * Math.sin(WAVE_K * (x * 0.9 + y) - t * 2.6)
                * (0.75 + 0.25 * Math.sin(t * 0.7 + y * 0.5));
        }
        const fromAttachment = Math.min(fromMast, fromArm);
        const envelope = Math.pow(Math.min(fromAttachment * 1.6, 1), 1.15);
        return AMPLITUDE * envelope
            * Math.sin(WAVE_K * (x * 0.9 + y) - t * 2.6)
            * (0.75 + 0.25 * Math.sin(t * 0.7 + y * 0.5));
    }

    function displacement(x, y, t) {
        const sway = mastArcOf ? poleSway(mastArcOf(x, y), t) : 0;
        return sway + waveOnly(x, y, t);
    }

    function withRidge(i, z) {
        return z + hemRidge[i];
    }

    function applyWind(t) {
        for (let i = 0; i < positions.count; i++) {
            const [x, y] = restXY[i];
            positions.setZ(i, withRidge(i, displacement(x, y, t)));
        }
        positions.needsUpdate = true;
        geometry.computeVertexNormals();
        for (const { line, base } of guides) {
            const attr = line.geometry.attributes.position;
            for (let i = 0; i < base.length; i++) {
                attr.setZ(i, displacement(base[i].x, base[i].y, t) + GUIDE_LIFT);
            }
            attr.needsUpdate = true;
        }
        // The fold is sewn to the cloth: same wind, 2 mm behind it.
        for (const fold of hemFolds) {
            for (let i = 0; i < fold.rest.length; i++) {
                const [x, y] = fold.rest[i];
                fold.positions.setZ(i, displacement(x, y, t) - 2 * S);
            }
            fold.positions.needsUpdate = true;
        }
        // The mast rides its own sway — the sleeve and the tube inside it move as one thing.
        for (const piece of mastPieces) {
            for (let v = 0; v < piece.s.length; v++) {
                piece.positions.setZ(v, piece.rest[v * 3 + 2] + poleSway(piece.s[v], t));
            }
            piece.positions.needsUpdate = true;
        }
        for (const collar of mastCollars) {
            collar.mesh.position.z = poleSway(collar.s, t);
        }
    }

    /* Still air is not a plane: real cloth keeps a gentle bow and a soft fold near the free
       corner. The same shape the wind displaces, frozen at a whisper — so "calm" has depth and
       toggling the wind does not snap between two different objects. */
    function restingBow(x, y) {
        // Wave only: at rest the POLE is straight, so the cloth's bow must not inherit sway.
        return waveOnly(x, y, 1.35) * 0.22;
    }

    /* DEAD FLAT, for the blade to work on. Not `calmDown`, which keeps a gentle bow: a cut has to
       run on cloth that is still AND flat, so the only thing left standing proud is the reinforcing
       hem, which is fabric rather than motion (the shop, 2026-09-01). */
    function flattenCloth() {
        for (let i = 0; i < positions.count; i++) positions.setZ(i, withRidge(i, 0));
        positions.needsUpdate = true;
        geometry.computeVertexNormals();
        for (const { line, base } of guides) {
            const attr = line.geometry.attributes.position;
            for (let i = 0; i < base.length; i++) attr.setZ(i, GUIDE_LIFT);
            attr.needsUpdate = true;
        }
        for (const fold of hemFolds) {
            for (let i = 0; i < fold.rest.length; i++) fold.positions.setZ(i, -2 * S);
            fold.positions.needsUpdate = true;
        }
        for (const piece of mastPieces) {
            piece.positions.array.set(piece.rest);
            piece.positions.needsUpdate = true;
        }
        for (const collar of mastCollars) collar.mesh.position.z = 0;
    }

    function calmDown() {
        for (let i = 0; i < positions.count; i++) {
            const [x, y] = restXY[i];
            positions.setZ(i, withRidge(i, restingBow(x, y)));
        }
        positions.needsUpdate = true;
        geometry.computeVertexNormals();
        for (const { line, base } of guides) {
            const attr = line.geometry.attributes.position;
            for (let i = 0; i < base.length; i++) {
                attr.setZ(i, restingBow(base[i].x, base[i].y) + GUIDE_LIFT);
            }
            attr.needsUpdate = true;
        }
        for (const piece of mastPieces) {
            piece.positions.array.set(piece.rest);
            piece.positions.needsUpdate = true;
        }
        for (const collar of mastCollars) collar.mesh.position.z = 0;
        for (const fold of hemFolds) {
            for (let i = 0; i < fold.rest.length; i++) {
                const [x, y] = fold.rest[i];
                fold.positions.setZ(i, restingBow(x, y) - 2 * S);
            }
            fold.positions.needsUpdate = true;
        }
    }
    calmDown();

    function resize() {
        const w = stage.clientWidth, h = stage.clientHeight;
        renderer.setSize(w, h);
        // The flag is drawn into its band, not the whole canvas, so the band is its aspect.
        camera.aspect = w / bandHeight();
        camera.updateProjectionMatrix();
        fitFront();
    }
    window.addEventListener('resize', resize);
    resize();
    fitCamera();

    windBox.addEventListener('change', () => { if (!windBox.checked) calmDown(); });

    /* The other half of the quality ladder: watch what this machine actually manages and step
       down until it keeps up. Sampled in blocks rather than per frame, because one slow frame is
       a hiccup and a slow BLOCK is a slow device.

       It used to step DOWN only, so that whatever the worst moment of a visit was, the hero wore
       it for the rest of the visit — and the worst moment is usually not the GPU at all but the
       rest of the page loading, or the tab going to the background. Watched for a minute the hero
       therefore looked like it was rotting. Three things fix that, and all three are about not
       believing a slow block too readily:

       * a HIDDEN tab is not measured. Its rAF is clamped to about 1 fps, which reads as a
         catastrophically slow device and used to cost two rungs per glance at another window.
       * the block's SLOWEST FRAME is thrown away before the average is taken. A stall — a GC
         pause, another iframe's decode, a laptop waking — is one or two frames that drag a
         45-frame mean over the bar on hardware that was keeping up either side of it. Sustained
         slowness is every frame, and survives losing its worst one. (Not a ceiling on the average,
         which was the first thing tried and was wrong: at 9 fps the Intel HD 530 this ladder
         exists for averages 111 ms, so any ceiling low enough to catch a stall also discards every
         block from the slowest machine there is, and it never steps down at all.)
       * it steps back UP, but reluctantly: several consecutive blocks with real headroom, not one
         merely adequate one. The gap between the down bar and the up bar is what stops the
         oscillation the one-way version was avoiding — a hero flickering between sharp and soft
         is genuinely worse than either.

       "Headroom" is measured against THE DISPLAY'S OWN FLOOR, not an absolute millisecond count,
       because rAF cannot run faster than the refresh rate: a 60 Hz panel with nothing to do reports
       16.7 ms a frame and no more, so an absolute bar of 13 ms is one no 60 Hz machine can ever
       clear, and the step up never fires (measured over CDP at dpr 2.5, 2026-09-01: the ladder walked
       2 → 1.5 → 1 → 0.75 → 0.55 under load and then sat at 0.55 for forty seconds at a clean
       16.7 ms). So the floor is learned — the lowest block average yet seen converges on the vsync
       interval — and a block is roomy when it is essentially AT that floor. The absolute target has
       to be met as well, so a slow machine whose floor is itself 57 ms is never called roomy. */
    const QUALITY_TARGET_MS = 22;          // ~45 fps — over this, the machine is not keeping up
    const QUALITY_AT_FLOOR = 1.15;         // within 15% of the learned floor = hitting refresh rate
    const QUALITY_BLOCK = 45;              // frames per verdict
    const QUALITY_ROOMY_BLOCKS = 4;        // consecutive roomy blocks before stepping back up
    let paceFloor = Infinity;              // the fastest block this machine has managed
    let blockFrames = 0, blockStart = performance.now(), roomyBlocks = 0;
    let frameLast = performance.now(), blockWorst = 0;
    // What the full fabric shader was, so the bottom rung can hand it back. Read off the material
    // rather than restated, because a second copy of these values is one that drifts from it.
    const FABRIC = { sheen: clothMaterial.sheen, bumpMap: clothMaterial.bumpMap,
                     roughnessMap: clothMaterial.roughnessMap };

    function applyQuality() {
        renderer.setPixelRatio(QUALITY[qualityStep]);
        resize();
        // Bottom of the ladder: resolution alone is not enough, so the fabric shader goes too.
        // Sheen and the weave bump are the expensive part and the least visible at hero size.
        const bottom = qualityStep === QUALITY.length - 1;
        clothMaterial.sheen = bottom ? 0 : FABRIC.sheen;
        clothMaterial.bumpMap = bottom ? null : FABRIC.bumpMap;
        clothMaterial.roughnessMap = bottom ? null : FABRIC.roughnessMap;
        clothMaterial.needsUpdate = true;
    }

    function watchQuality() {
        const lowest = layered ? QUALITY_FLOOR : QUALITY.length - 1;
        if (!HERO) return;
        const now = performance.now();
        const sinceLast = now - frameLast;
        frameLast = now;
        // Not measurable while hidden, and the frames either side of becoming visible again are
        // not either — so the block in progress is thrown away rather than finished.
        if (document.visibilityState !== 'visible') {
            blockFrames = 0;
            blockStart = now;
            blockWorst = 0;
            return;
        }
        blockFrames += 1;
        blockWorst = Math.max(blockWorst, sinceLast);
        if (blockFrames < QUALITY_BLOCK) return;
        // The worst frame comes out of both the numerator and the count, so what is left is the
        // pace the machine actually held for the rest of the block.
        const average = (now - blockStart - blockWorst) / (blockFrames - 1);
        blockFrames = 0;
        blockStart = now;
        blockWorst = 0;
        if (average > QUALITY_TARGET_MS) {
            roomyBlocks = 0;
            if (qualityStep >= lowest) return;
            qualityStep += 1;
            applyQuality();
            return;
        }
        // Learned from blocks that met the target, so a permanently struggling machine never
        // teaches the ladder that struggling IS its floor.
        paceFloor = Math.min(paceFloor, average);
        if (average > paceFloor * QUALITY_AT_FLOOR || qualityStep === 0) {
            roomyBlocks = 0;                            // adequate is not roomy: hold this rung
            return;
        }
        roomyBlocks += 1;
        if (roomyBlocks < QUALITY_ROOMY_BLOCKS) return;
        roomyBlocks = 0;
        qualityStep -= 1;
        applyQuality();
    }

    /* The guide lines and the sewn hem describe the FINISHED template, so they belong to the
       finished flag. Drawn over a sheet three cuts away from being one, they claim an edge that is
       not there yet — with a single cut that was one wrong outline, with a roll of four it is
       three. The cut reveals them when the ordered shape actually exists. */
    const trim = guides.map(g => g.line).concat(hemFolds.map(f => f.mesh));
    const showTrim = (on) => { for (const object of trim) object.visible = on; };
    if (stages) showTrim(false);

    const cutRunner = installCut({ S, stages, finished: fabric,
                                   morphs: !!(cutFit && cutFit.morph),
                                   box, clothW, clothH,
                                   paintSilhouette, clothMaterial, group, front, showTrim,
                                   rig, sheetRig, sheetTunnel, poleTravel, flag,
                                   brand: { name: {{ brand_name|tojson }},
                                            logo: {{ brand_logo|tojson }} } });
    // A roll drives the camera every frame; a drag would only fight it. Inspecting a template is
    // what the same page WITHOUT `?cutFrom=` is for, and there the controls are untouched.
    if (cutRunner) controls.enabled = false;

    /* A FULL TURN, not the old sway: the flag comes round once every SPIN_SECONDS, so both faces
       are seen and the print is read from every angle. Slow on purpose — this plays behind copy. */
    const SPIN_SECONDS = 28;
    const SPIN_RATE = Math.PI * 2 / SPIN_SECONDS;
    // Awers square to the camera, framed whole: the one shot a cut is allowed to happen in.
    const SQUARE_ON = { dist: 1.0, yaw: 0, aim: 0.5 };

    /* ── Movement, and where it must stop ──
       THE BACK LAYER MOVES LIKE THE HERO, because that is what it is: the tour's own zoom and
       travel, with a full turn under it. But ONLY while a flag is being presented. The moment the
       roll reaches a cut the flag has to be square, flat and still, so the turn eases to the
       nearest whole revolution and the camera comes round to straight-on across the `square` beat,
       and stays there until the next flag's turn. Reduced motion stops the turn outright.

       `spin` is kept rather than computed from the clock: an angle that is a function of time cannot
       be eased to a stop and picked up again where it left off. */
    let spin = 0, hold = null, flattened = false;
    function driveLayered(beat, seconds, delta) {
        if (beat.kind === 'present') {
            if (flattened && !windBox.checked) calmDown();   // give the cloth its resting bow back
            hold = null;
            flattened = false;
            if (!calm) spin += delta * SPIN_RATE;
            group.rotation.y = spin;
            placeCamera(tourAt(seconds));
            return true;                                    // wind may blow
        }
        // Squaring up, then held there. Captured once, so the ease has a fixed start to run from.
        if (!hold) {
            hold = { spin, cam: tourAt(seconds),
                     whole: Math.round(spin / (Math.PI * 2)) * Math.PI * 2 };
        }
        const k = beat.kind === 'square' ? smooth(beat.k) : 1;
        spin = hold.spin + (hold.whole - hold.spin) * k;
        group.rotation.y = spin;
        placeCamera({
            dist: hold.cam.dist + (SQUARE_ON.dist - hold.cam.dist) * k,
            yaw: hold.cam.yaw + (SQUARE_ON.yaw - hold.cam.yaw) * k,
            aim: hold.cam.aim + (SQUARE_ON.aim - hold.cam.aim) * k,
        });
        if (!flattened) { flattenCloth(); flattened = true; }
        return false;                                       // and no wind while the blade is in it
    }

    const clock = new THREE.Clock();
    let previous = 0;
    renderer.setAnimationLoop(() => {
        const seconds = clock.getElapsedTime();
        // Our own delta: THREE.Clock's getDelta() and getElapsedTime() share an oldTime, so calling
        // both in one frame counts the same milliseconds twice.
        const delta = Math.min(Math.max(seconds - previous, 0), 0.1);
        previous = seconds;
        const beat = cutRunner ? cutRunner(seconds) : null;
        watchQuality();
        let windAllowed = true;
        if (beat && layered) {
            windAllowed = driveLayered(beat, seconds, delta);
        } else if (beat) {
            /* A page that is nothing BUT the animation keeps the roll's own held-wide framing, where
               the blade is the subject and a close-up mid-stroke would hide it. Still no wind and no
               bow once the cutting starts, for the same reason as above. */
            driveRoll(beat);
            windAllowed = beat.kind === 'present';
            if (!windAllowed && !flattened) { flattenCloth(); flattened = true; }
            if (windAllowed) flattened = false;
        } else if (bare && !calm) {
            group.rotation.y = Math.sin(seconds * 0.16) * 0.5;
            driveTour(seconds);
        }
        if (windBox.checked && windAllowed) applyWind(seconds);
        controls.update();

        /* ── Two passes, one canvas ──
           The flag is SCISSORED into its own band, so however far the canvas extends below the hero
           the flag cannot spill onto the page. The cloth is drawn after it, across the whole canvas,
           with the depth buffer cleared between them — that clear is what makes the front layer
           genuinely in front rather than merely later. */
        const w = stage.clientWidth, h = stage.clientHeight, band = bandHeight();
        if (layered) {
            renderer.setViewport(0, h - band, w, band);
            renderer.setScissor(0, h - band, w, band);
            renderer.setScissorTest(true);
        }
        renderer.render(scene, camera);
        if (layered) {
            renderer.setScissorTest(false);
            renderer.setViewport(0, 0, w, h);
            renderer.autoClear = false;
            renderer.clearDepth();
            renderer.render(front, frontCamera);
            renderer.autoClear = true;
        }
    });
}

function ringArea(points) {
    let doubled = 0;
    for (let i = 0; i < points.length; i++) {
        const [x1, y1] = points[i];
        const [x2, y2] = points[(i + 1) % points.length];
        doubled += x1 * y2 - x2 * y1;
    }
    return Math.abs(doubled / 2);
}
</script>
